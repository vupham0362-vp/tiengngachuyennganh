ология понижения радиолокационной заметности: малая поверхность рассеивания, малый размер выступающих частей, радиопоглощающее покрытие.", "“Стелс-технология” – это технология защиты ракеты от поражения системами ПВО/ПРО на разгонном участкетраектории.", "“Стелс-технология” – это технология защиты ракеты от поражения системами ПВО/ПРО на баллистическом участке траектории.", "“Стелс-технология” – это технология повышения радиолокационной заметности: малая поверхность рассеивания, малый размер выступающих частей, радиопоглощающее покрытие."], "fix": false}, {"q": "Почему эксперты считают, что траектория «Искандер-М» является «квазибаллистической»?", "o": ["Потому, что «Искандер-М» использует маневрирование за счёт газоструйных рулей.", "Потому, что большая часть полёта «Искандер-М» проходит на высоте около 50 км, что существенно выше потолка действия таких систем ПВО как Patriot.", "Потому, что «Искандер-М» имеет средства маневрирования на баллистическом участке траектории полета.", "Потому, что «Искандер-М» использует аэродинамические рули для интенсивного маневрирования при наборе высоты."], "fix": false}, {"q": "Какие характеристики, превращающие «Искандер» из тактического в «геостратегическое оружие»?", "o": ["- «Искандер» имеет средства маневрирования на всех участках траектории полета;\n- «Искандер» укомплектован модулями радиоэлектронной борьбы (РЭБ) и сбрасываемыми ложными целями", "«Искандер» имеет средства маневрирования на всех участках траектории полета.", "«Искандер» укомплектован модулями радиоэлектронной борьбы (РЭБ) и сбрасываемыми ложными целями.", "Ни один из этих ответов не является правильным"], "fix": false}, {"q": "Какие методы защиты ракеты «Искандер» от поражения ПВО/ПРО на финишном участке траектории полета?", "o": ["Маневрирование с болшой перегрузкой, гиперзвуковая скорость 6-7 Мах", "Маневрирование за счёт аэродинамических рулей", "Маневрирование за счёт газоструйных рулей.", "Использование ложных целей."], "fix": false}]}, {"id": 16, "p": "Крылатая ракета «Искандер-К»\n«Искандер-К» — вариант с использованием двух крылатых ракет Р-500, дальность стрельбы — 500 км, масса БЧ — 480 кг. Высота полёта ракеты около 7 метров при выходе на цель, и не выше 6 км, ракета автоматически корректируется всё время полёта и автоматически огибает рельеф местности. Эксперты Пентагона считают, что официальная дальность ракеты фиктивно занижена, чтобы скрыть нарушение Договора о ликвидации ракет средней и меньшей дальности, а реальная дальность этой крылатой ракеты составляет 2000-2600 километров.\nПервоначально западные источники придерживались версии, что ракета создана на базе «запрещённой» крылатой ракеты большой дальности C-10 «Гранат». Однако с 2017 года разведчики США более склонны считать, что крылатая ракета для «Искандер» является эквивалентом проектов известных как 9М729 (по классификации НАТО SSC-8), то есть сухопутной версией крылатой ракеты семейства «Калибр». Другая версия гласит, что ракета, используемая данными комплексами, является наземным вариантом ракеты Х-101, а не «Калибра». Ракета Х-101 относится к классу носителей стратегического ядерного оружия, а также способна поражать подвижные цели.\nОтметим, что фактически все крылатые ракеты имеют ресурс двигателя в несколько раз выше максимальной дальности полёта, и дальность полёта увеличивается сокращением веса боевой части и увеличением веса для топливных баков, поэтому сама по себе дальность не позволяет точно определить семейство крылатой ракеты.\nСами конструкторы заявляют ракету как «аэробаллистическую», а не совсем классическую крылатую ракету. Показанные публично пуски крылатой ракеты действительно указывают на начало полёта по баллистической траектории. Иными словами, крылатая ракета, подобно «Искандер-М», стремится быстро закончить разгонный участок и выйти на большую высоту для снижения сопротивления воздуха и увеличения дальности полёта; снижение происходит непосредственно перед атакой цели. Такой же метод увеличения дальности полёта используют крылатые ракеты нового поколения, как, например, «Калибр».\nИсточники не сообщают каких-то сведений о средствах прорыва  противоракетной обороны (ПРО) для «Искандер-К» кроме малой высоты полёта перед атакой цели. Но если используется вариант ракеты X-101, то крылатые ракеты данного семейства исполнены по технологии «стелс». Ракета изготовлена с применением технологий понижения радиолокационной заметности (так называемой «Стелс-технологии»): малая поверхность рассеивания, малый размер выступающих частей, радиопоглощающее покрытие.", "qs": [{"q": "Сколько ракет на одной ПУ для варианта «Искандер-К»?", "o": ["2", "3", "4", "1"], "fix": false}, {"q": "Какой диапозон высоты полета крылатых ракет Р-500?", "o": ["7…6000м", "5…10000м", "2000…2600м", "5…7км"], "fix": false}, {"q": "Почему дальность не позволяет точно определить семейство крылатой ракеты?", "o": ["Дальность полёта можно увеличивать путём сокращения веса боевой части и увеличения веса для топливных баков.", "Дальность полёта не может увеличивать путём сокращения веса боевой части и увеличения веса для топливных баков для определенного семейства крылатой ракеты.", "Определение типа семейства крылатой ракеты не зависит от дальность полета крылатых ракет.", "Определение типа семейства крылатой ракеты зависит от схемы и других характеристихкрылатых ракет."], "fix": false}, {"q": "К какому классу относится ракет Р-500 комплекса «Искандер-К»?", "o": ["Аэробаллистическая ракета", "Классическая крылатая ракета.", "Баллистическая ракета", "Обычная баллистическая ракета"], "fix": false}, {"q": "Что такое “Стелс-технология”?", "o": ["“Стелс-технология” – это технология понижения радиолокационной заметности: малая поверхность рассеивания, малый размер выступающих частей, радиопоглощающее покрытие.", "“Стелс-технология” – это технология защиты ракеты от поражения системами ПВО/ПРО на разгонном участкетраектории.", "“Стелс-технология” – это технология защиты ракеты от поражения системами ПВО/ПРО на баллистическом участке траектории.", "“Стелс-технология” – это технология повышения радиолокационной заметности: малая поверхность рассеивания, малый размер выступающих частей, радиопоглощающее покрытие."], "fix": false}]}, {"id": 17, "p": "Что такое аэробаллистическая ракета?\nВоенные ракеты бывают крылатыми и баллистическими. Крылатая ракета летит, как самолет - ее поддерживают в воздухе крылья.\nБаллистические летят как камень, который бросают в воздух вверх. Он движется по инерции, пока сила тяготения Земли и сопротивление воздуха не затормозят его настолько, что он направится вниз. Баллистическая ракета поднимается до тех пор, пока не прекратит работать двигатель, после чего начинает падать в направлении цели. Такую траекторию и называют баллистической.\nОбычную баллистическую ракету перехватить проще, потому что можно просчитать ее траекторию, хотя современные баллистические ракеты способны маневрировать за счет аэродинамических рулей, но такие маневры, как правило, не спасают их от зенитных ракет последнего поколения.\nАэробаллистическая ракета отличается от баллистической тем, что на большой скорости сам ее корпус создает подъемную силу за счет воздушных потоков и областей с повышенной и пониженной плотностью.\nТаким образом, аэробаллистическая ракета, не оснащенная крыльями, может совершать полет по более пологой траектории, чем обычная баллистическая. Она также может маневрировать в плотных слоях атмосферы - не только с целью избежать поражения противоракетой, но и чтобы продолжать полет, корректируя свое положение в пространстве.\nБаллистические ракеты, как и аэробаллистические, на последнем этапе полета часто заходят на цель практически отвесно. Это делается для того, чтобы осложнить работу ПВО. У радаров обнаружения, которые следят за воздушным пространством, часто бывает так называемая мертвая воронка - слепая зона прямо над радаром, где они не могут отследить объекты, либо хуже их видят.\n\"Кинжал\", судя по заявлениям Министерства обороны России, а также по кадрам, на которых показано попадание ракеты в цель, действительно падает на нее отвесно.\nВ России \"Кинжал\" называют не ракетой, а комплексом, потому что его носитель - самолёт МиГ-31К - является очень важной частью. Он поднимает ракету на высоту до 15 км, разгоняется до большой скорости (максимальная скорость МиГ-31 - 3 тыс. км/ч) и запускает ракету. Фактически самолет выполняет функцию первой ступени ракеты.\nВоздушный пуск помогает ракете быстро набирать скорость, не тратя на это много топлива - во-первых, она уже летит на большой скорости, будучи прикрепленной к самолету, а во-вторых, ей не надо преодолевать плотные слои атмосферы, как это приходится делать ракетам, запускаемым с земли. Далее \"Кинжал\" поднимается до высоты примерно 20 километров и разгоняется до гиперзвуковой скорости. После входа в плотные слои атмосферы он совершает маневр, направляясь к земле под углом, близким к 90 градусов", "qs": [{"q": "Почему перехватить современную баллистическую ракету сложнее?", "o": ["Современные баллистические ракеты способны маневрировать за счет аэродинамических рулей.", "Траектория современных баллистических ракет может просчитать с помощью ЭВМ", "Современные баллистические ракеты летят по баллистической траектории, то есть находится в неуправляемом движении.", "Современные баллистические ракеты не способны маневрировать за счет аэродинамических рулей."], "fix": false}, {"q": "Как подъёмная сила создается для аэробаллистической ракеты?", "o": ["Корпус аэробаллистической ракеты создает подъемную силу за счет воздушных потоков и областей с повышенной и пониженной плотностьюна большой скорости.", "Крылья аэробаллистической ракеты создают подъемную силу за счет воздушных потоков и областей с повышенной и пониженной плотностьюна большой скорости.", "Корпус аэробаллистической ракеты создает подъемную силу за счет воздушных потоков на большой скорости.", "Корпус аэробаллистической ракеты создает подъемную силу за счет областей с повышенной и пониженной плотностью на большой скорости."], "fix": false}, {"q": "Что такая мертвая воронка радаров обнаружения?", "o": ["Мертвая воронка называется слепую зону прямо над радаром, где они не могут отследить объекты, либо хуже их видят.", "Мертвая воронка называется видимую зону радара, где они могут отследить объекты.", "Мертвая воронка – это воздушное пространство вокруг РЛС.", "Мертвая воронка – это зона поражения ПВО/ПРО противника."], "fix": false}, {"q": "Какие силы действуют на баллистическую ракету на траектории полета?", "o": ["Сила тяготения Земли, сила сопротивления воздуха, тяга двигатели.", "Сила тяготения Земли, сила сопротивления воздуха, подъёмная сила крыла.", "Сила тяготения Земли, подъёмная сила корпуса и крыла, тяга двигатели.", "Сила тяготения Земли, сила сопротивления воздуха, подъёмная сила корпуса, тяга двигатели."], "fix": false}, {"q": "Какую роль играет самолёт МиГ-31К в составе комплекса \"Кинжал\"?", "o": ["Носитель ракеты", "Первая ступень ракеты", "ПУ ракеты", "Сочетание трех остальных вариантов."], "fix": false}]}, {"id": 18, "p": "Назначение, состав, основные характеристики оптической головки самонаведения\nПассивная двухдиапазонная оптическая головка самонаведения (ГСН) 9Э47 является основным элементом ракеты 9М37 и предназначена для захвата цели, ее автосопровождения и выдачи в автопилот управляющих сигналов, пропорциональных угловой скорости вращения линии РАКЕТА–ЦЕЛЬ и углу пеленга.\nУгол пеленга – угол между продольной осью ракеты и осью ГСН, в ЗУР 9М37 он может изменяться от 0 до 40° в любом направлении.\nКонструктивно ГСН состоит из двух основных узлов: гиро-координатора и электронного блока.\nОсновные технические характеристики ГСН:\n- поле зрения - 1º;\n- максимальные углы пеленга - 40°;\n- время готовности к работе - 5 с;\n- время непрерывной работы ГСН - 10 мин с последующим перерывом на 30 мин.\nСледящий координатор цели и оптическая система являются основными элементами оптической головки самонаведения. Следящий координатор цели предназначен для измерения угловой скорости вращения линии РАКЕТА-ЦЕЛЬ.Оптическая система предназначена для фокусирования потока лучистой энергии от цели, его модуляции и преобразования в электрический сигнал.\nОптическая система представляет собой зеркально-линзовый объектив, рассчитанный для двух диапазонов длин волн. Состоит из системы оптических устройств, модулирующих дисков и фотоприемников.\nОптическая система принимает энергию от цели, разделяет ее на два канала: фотоконтрастный (ФК) и инфракрасный (ИК) и фокусирует на модулирующих дисках (МД).\nВ ФК-канале используется модуляция светового потока вращающимся МД, а в ИК-канале - вращением изображения цели по неподвижному МД.\nЭти диски модулируют поток лучистой энергии цели, который поступает в фотоприемник. В нем поток энергии преобразуется в электрический сигнал, параметры которого зависят от взаимного положения цели и ракеты - величины и направления угла между осью ГСН и направлением на цель.\nВ общем виде модуляции сигнала от цели осуществляется  модулирующим диском. В изменении частоты полученного электрического сигнала содержится информация об отклонении цели от оптической оси ГСН, то есть осуществляется частотная модуляция сигнала от цели.\nВ оптической системе ГСН 9М37 применены более сложные модулирующие диски, которые обеспечивают: в ФК-канале – амплитудно-фазовую модуляцию, а в ИК-канале - частотно-фазовую модуляцию сигнала от цели.\nВ координатном преобразователе управляющий сигнал преобразовывается в управляющее напряжение, пропорциональное угловой скорости линии РАКЕТА-ЦЕЛЬ и углу пеленга. Это напряжение поступает на вход автопилота для выработки углов поворота рулей ракеты", "qs": [{"q": "Какой тип головки самонаведния использует в ракете 9М37?", "o": ["Пассивная двухдиапазонная оптическая головка самонаведения.", "Активная головка самонаведения.", "Пассивная телевизионная головка самонаведения", "Пассивная тепловая оптическая головка самонаведения"], "fix": false}, {"q": "Какой максимальный угол пеленга оптической ГСН ракеты 9М37?", "o": ["40°", "30°", "15°", "45°"], "fix": false}, {"q": "Сколько времени непрерывной работы оптической ГСН ракеты 9М37?", "o": ["5 мин. с последующим перерывом на 20 мин.", "10 мин. с последующим перерывом на 30 мин.", "15 мин. с последующим перерывом на 40 мин.", "20 мин. с последующим перерывом на 1 час"], "fix": false}, {"q": "Для чего предназначен следящий координатор цели ГСН ракеты 9М37?", "o": ["Для измерения угловой скорости вращения линии РАКЕТА-ЦЕЛЬ.", "Для контроля и проверки ГСН.", "Для слежения за работой автопилота.", "Все вышеперечисленные пункты."], "fix": true}, {"q": "Для чего координатный преобразователь электронного блока оптической ГСН ракеты 9М37 предназначен?", "o": ["Для преобразования сигналов от цели и выработки команд управления рулями ракеты.", "Для быстрого разгона и поддержания номинальной частоты вращения гироскопа.", "Для преобразования сферических координат цели в прямоугольные.", "Для совмещения оптической оси ГСН (оси ротора гироскопа) с продольной осью ракеты во время прицеливания."], "fix": false}]}, {"id": 19, "p": "Назначение, состав и тактико-технические характеристики комплекса «Стрела-10»\nЗенитный ракетный комплекс «Стрела-10» предназначен для уничтожения визуально наблюдаемых самолетов, вертолетов, крылатых ракет и других воздушных целей на высотах от 25 до 3500 м, дальностях от 800 до 5000 м, при курсовых параметрах до 3000 м.\nТактико – технические характеристики ЗРК «Стрела-10»:\n- комплекс обеспечивает стрельбу с места, с коротких остановок и в движении со скоростью до 30 км/час по целям на встречном и догонном курсе;\n- дальность поражения целей – от 800 до 5000 м;\n- высота поражения цели – от 25 до 3500 м;\n- скорость поражаемых целей:\n          + на встречных курсах – до 420 м/с;\n          + на догонных курсах – до 310 м/с.\n- вероятность поражения цели одной ракетой – 0,5 - 0,6;\nВ состав комплекса входят:\n- боевые средства:\n          + боевая машина (БМ) 9А34 (9А35);\n          + зенитная управляемая ракета (ЗУР) 9М37.\n- средства технического обслуживания:\n          + контрольно-проверочная машина (КПМ) 9В839;\n          + машина технического обслуживания (МТО) 9В915;\n          + система внешнего электропитания 9И111.\n- учебно-тренировочные средства:\n          + тренажер 9Ф624;\n          + аппаратура контроля оператора 9Ф75;\n          + учебно-действующие ракеты 9Ф918;\n          + габаритно-весовые макеты ракет 9Ф83.\nВ ЗРК «Стрела-10» реализован принцип «выстрелил – забыл» и применена пассивная система самонаведения. Основным элементом комплекса является головка самонаведения (ГСН) ракеты. Двухканальная ГСН принимает лучистую энергию от контрастной на фоне неба цели или ее инфракрасную энергию. По этим сигналам в ракете определяются характеристики и параметры движения цели и вырабатываются команды наведения, по которым ракета наводится на цель.\nРабота комплекса заключается в следующем.\nПри получении целеуказания или самостоятельном визуальном обнаружении воздушной цели оператор наводит пусковую установку с ракетами на цель, используя электрические приводы наведения в вертикальной и горизонтальной плоскостях.\n Одновременно подается питание на первую ракету и открывается передняя крышка контейнера. ГСН ракеты захватывает воздушную цель, пусковая установка осуществляет ее автоматическое сопровождение.\nНРЗ производит запрос государственной принадлежности цели. Аппаратура оценки зоны оценивает параметры движения цели. В момент входа цели в зону пуска в оптическом визире оператора загорается лампочка ЗОНА, что является разрешением на пуск ракеты.\nОператор пускает ракету.\nВ полете обеспечивается автономное наведение ракеты на цель. При попадании ракеты в цель или промахе до 4 м срабатывает взрывательное устройство, подрывается боевая часть, цель поражается осколками и ударной волной. При промахе более 4 м через 16 секунд полета взрывательное устройство блокируется, и ракета падает на землю.\nБоевой расчет БМ «Стрела-10»состоит из трех человек: командира БМ, оператора и механика-водителя", "qs": [{"q": "Для чего предназначен зенитный ракетный комплекс «Стрела-10»?", "o": ["Для уничтожения визуально наблюдаемых самолетов, вертолетов, крылатых ракет и других воздушных целей на высотах от 25 до 3500 м, дальностях от 800 до 5000 м, при курсовых параметрах до 3000 м.", "Для уничтожения визуально наблюдаемых самолетов, вертолетов, крылатых ракет и других воздушных целей на высотах от 25 до 4500 м, дальностях от 800 до 5000 м, при курсовых параметрах до 3000 м", "Для уничтожения визуально наблюдаемых самолетов, вертолетов, крылатых ракет и других воздушных целей на высотах от 25 до 4500 м, дальностях от 800 до 6000 м, при курсовых параметрах до 3000 м", "Для уничтожения визуально наблюдаемых самолетов, вертолетов, крылатых ракет и других воздушных целей на высотах от 25 до 3500 м, дальностях от 800 до 6000 м, при курсовых параметрах до 3000 м"], "fix": false}, {"q": "Что входит в состав комплекса «Стрела-10»?", "o": ["Боевые, технического обслуживания, учебно-тренировочные", "Боевые, материального обеспечения, учебно-тренировочные", "Боевые, технического обслуживания, учебно-действующие", "Боевые, материального обеспечения, учебно-действующие."], "fix": false}, {"q": "Кто включает в себя боевой расчет БМ «Стрела-10»?", "o": ["Командир БМ, оператор, механик-водитель", "Командир БМ, оператор, механик", "Командир БМ, оператор поиска дальности, механик-водитель", "Командир БМ, оператор поиска дальности, механик"], "fix": false}, {"q": "Какая скорость поражаемых целей на встречных курсах?", "o": ["До 420 м/с", "До 310 м/с", "До 810 м/с", "До 520 м/с"], "fix": false}, {"q": "Что включает в себя боевые средства ЗРК «Стрела-10»?", "o": ["боевая машина, зенитная управляемая ракета.", "боевая машина, аппаратура контроля оператора.", "боевая машина, габаритно-весовые макеты ракет.", "боевая машина, контрольно-проверочная машина."], "fix": false}]}, {"id": 20, "p": "Автопилот ракеты 9М37 ЗРК «Стрела-10»\n1. Назначение, состав и размещение автопилота\nНаведение ракеты на цель осуществляется системой управления ЗРК, которая определяет взаимное положение цели и ракеты и вырабатывает команды управления полетом ракеты.\nВ ЗРК «Стрела-10» применена пассивная система самонаведения.\nСамонаведение - управление полетом ракеты осуществляется командами, вырабатываемыми на борту ракеты. Пассивная система - цель ничем не облучается, а ГСН использует энергию, излучаемую целью – инфракрасную или фотоконтрастную.\nСистема управления ЗРК «Стрела-10» включает в себя ГСН, рассмотренную на предыдущем занятии, и автопилот.\nАвтопилот 9В612 предназначен для преобразования управляющих сигналов, поступающих с ГСН, в соответствующие углы поворота рулей.\nВ состав автопилота входят блок электроники и блок рулевых машин (БРМ).\nКонструктивно автопилот размещается во втором отсеке ракеты вместе с контактным датчиком цели (КДЦ).\nТехнические характеристики:\n- максимальное отклонение рулей - ±15°;\n- зона нечувствительности рулей - ±0,3°;\n- максимальная скорость отклонения рулей - 120 °/с;\n- тип рулевого привода – двухканальный электрический.\n2. Назначение и общее устройство элементов автопилота\nБлок электроники предназначен для формирования режимов наведения ракеты, преобразования управляющих сигналов и усиления их до величины, необходимой для работы электродвигателей БРМ.\nСостав блока электроники:\n- плата переключения режимов (ППР);\n- два усилителя сигналов рассогласования (УСР);\n- блок астатизма и селекции (БАС);\n- плата генератора и стабилизатора (ПГС).\nПлата переключения режимов отфильтровывает управляющие сигналы от шумов и с помощью транзисторного переключателя устанавливает коэффициенты пе­редачи этих сигналов, а также определяет заданный пеленг.\nДатчик заданного пеленга обеспечивает ракете на начальном участке такую траекторию полета, при которой исключается перезахват горизонта ГСН и касание ракетой земли.\nРеле режимов обеспечивают формирование режимов наведения ракеты ВПЕРЕД–НАЗАД, ВВЕРХ-ВНИЗ в зависимости от параметров движения цели и углов возвышения ПУ.\nУсилители сигналов рассогласования обеспечивают усиление сигнала рассогласования до величины, необходимой для управления электродвигателями рулевых машин.\nБлок астатизма и селекции включает в себя блок астатизма и плату селекции помех.\nБлок астатизма обеспечивает запоминание ГСН направления и скорости движения цели в случае кратковременного пропадания сигнала от нее. Плата селекции помех служит для отстройки ГСН от оптических помех.\nПлата генератора и стабилизатора, работающая от бортового блока питания ракеты, обеспечивает питанием элементы блока электроники.\nБлок рулевых машин (БРМ) предназначен для преобразования управляющих сигналов в соответствующие углы поворота рулей.\nКаждая рулевая машина, состоящая из электродвигателя, редуктора и потенциометра обратной связи, управляет двумя аэродинамическими рулями, закрепленными на валу редуктора.\nРули являются управляющим органом ракеты.\nИсполнительным элементом привода рулей является электродвигатель постоянного тока.", "qs": [{"q": "Для чего автопилот зенитной управляемой ракеты 9МЗ7 предназначен?", "o": ["Для преобразования управляющих сигналов, поступающих с ГСН в соответствующие углы поворота рулей", "Для получения ЦУ от ПУ-12 и управления работой АЗ", "Для подрыва боевой части", "Для запуска двигательной установки и регулирования режимов работы АОЗ"], "fix": false}, {"q": "Чем осуществляется управление полетом ракеты 9М37?", "o": ["Командами, вырабатываемыми на борту ракеты.", "Командами, вырабатываемыми аппаратурой запуска.", "Командами, вырабатываемыми аппаратурой оценки зоны.", "Все выше перечисленные пункты"], "fix": true}, {"q": "Где конструктивно автопилот ракеты 9М37 размещается?", "o": ["Во втором отсеке.", "В первом отсеке.", "В третьем отсеке.", "В четвертом отсеке."], "fix": false}, {"q": "Какое максимальное отклонение рулей блока рулевых машин ракеты 9М37?", "o": ["±15°.", "±10°.", "±20°.", "±25°."], "fix": false}, {"q": "Что включает в себя автопилота ракеты 9М37?", "o": ["Автопилота ракеты 9М37 включает в себя блок электроники и блок рулевых машин.", "Автопилота ракеты 9М37 включает в себя следящий координатор цели и блок рулевых машин.", "Автопилота ракеты 9М37 включает в себя головка самонаведения и блок рулевых машин.", "Автопилота ракеты 9М37 включает в себя блок крена и блок рулевых машин."], "fix": false}]}, {"id": 21, "p": "Контур управления зенитной управляемой ракетой\nЗенитная управляемая ракета (ЗУР) является активным элементом зенитно-ракетного комплекса (ЗРК), непосредственно обеспечивающим поражение цели. Часть элементов системы управления комплекса, осуществляющая непрерывное наведение ракеты на цель, называется системой наведения ЗРК. Система наведения ЗРК образует контур управления ЗУР. Элементы контура управления могут располагаться на земле и на ракете или только на борту ракеты. Контур управления ЗУР – это замкнутая система автоматического управления. Конечная цель автоматического управления ЗУР - поражение цели. Следовательно, траектория ракеты должна проходить через точку встречи ЗУР с целью (вблизи от цели или через цель). Таких траекторий может быть бесконечное количество. Однако нужно выбрать только такие траектории, которые обеспечиваются достаточно простыми техническими средствами или наиболее целесообразны с тактической точки зрения (минимальное время полёта, высокая вероятность поражения и т.д.). Поэтому необходимо ракете задать такое движение, которое в каждый момент времени определялось бы параметрами движения цели.\nЗакон сближения ракеты с целью, определяемый зависимостью требуемых параметров движения ракеты от параметров движения цели, называется методом наведения ЗУР. Траекторию полёта ракеты, определяемую уравнениями метода наведения, называют кинематической (требуемой). Действительная траектория полёта ракеты отличается от кинематической вследствие инерционности ЗУР и элементов системы управления, воздействия различных возмущений. Линейное отклонение ракеты от кинематической траектории называют параметром рассогласования (сигналом ошибки).\nВ состав контура управления ракетой (командной системы телеуправления) входят:\n-\tсистема измерения координат ракеты;\n-\tуправляющий блок;\n-\tканал радиоуправления (РУ);\n-\tзенитная управляемая ракета с системой стабилизации;\n-\tкинематическое звено ракеты.\nЦель и система измерения координат цели находятся во внешней цепи, не входящей в замкнутый контур, и являются источником внешних возмущений для этого контура. Системы измерения координат ракеты и цели собирают, обрабатывают и выдают информацию о координатах цели и ЗУР в управляющий блок. Управляющий блок – это счётно-решающий прибор, который на основе разности угловых координат цели и ракеты вычисляет составляющие параметра рассогласования (сигнала ошибки) и с учётом выбранного метода наведения вырабатывает команды управления.\nКоманды управления по линии радиоуправления подаются в автопилот ракеты, который обеспечивает отклонение рулей ракеты на соответствующие углы. Возникающая нормальная сила сближает ракету с кинематической траекторией, уменьшая величину параметра рассогласования. Изменение координат ракеты обнаруживается (через кинематическое звено) измерительным устройством и автоматически вводится поправка в команды управления, которые обеспечивают вывод ракеты на кинематическую траекторию. Вследствие инерционности ракета некоторое время совершает колебательные движения около кинематической траектории.\nПроцесс наведения автоматически продолжается до точки встречи ракеты с целью.", "qs": [{"q": "Какая часть системы управления комплекса выполняет непрерывное наведение ракеты на цель?", "o": ["Система наведения ЗРК", "Cистема измерения координат ракеты", "Кинематическое звено ракеты", "Канал радиоуправления"], "fix": false}, {"q": "Что такое контур управления ЗУР?", "o": ["Контур управления ЗУР – это замкнутая система автоматического управления. Конечная цель автоматического управления ЗУР - поражение цели.", "Система наведения ЗРК образует контур управления ЗУР.", "Контур управления ЗУР является активным элементом зенитно-ракетного комплекса (ЗРК).", "Элементы контура управления могут располагаться на земле и на ракете или только на борту ракеты."], "fix": false}, {"q": "Сколько возможно количеств траекторий ЗУР до точки встречи с целью?", "o": ["Бесконечно.", "3", "2", "1"], "fix": false}, {"q": "Почему действительная траектория полёта ракеты отличается от кинематической?", "o": ["Действительная траектория полёта ракеты отличается от кинематической вследствие инерционности ЗУР и элементов системы управления, воздействия различных возмущений.", "Потому, что траекторию полёта ракеты, определяемую уравнениями метода наведения, называют кинематической.", "Потому, что цель и система измерения координат цели находятся во внешней цепи, не входящей в замкнутый контур, и являются источником внешних возмущений для этого контура.", "Потому, что возникающая нормальная сила сближает ракету с кинематической траекторией."], "fix": false}, {"q": "Для чего нужен управляющий блок?", "o": ["Управляющий блок используется для вычисления составляющих параметра рассогласования (сигнала ошибки) на основе разности угловых координат цели и ракеты, а также для выработки команд управления с учётом выбранного метода наведения.", "Управляющий блок используется для сравнения составляющих параметра рассогласования (сигнала ошибки), а также для преобразования команд управления с учётом выбранного метода наведения.", "Управляющий блок используется для сравнения составляющих параметра рассогласования (сигнала ошибки), а также для обеспечения отклонения рулей ракеты на соответствующие углы.", "Управляющий блок используется для изменения координат ракеты и расчета поправки в команды управления, которые обеспечивают вывод ракеты на кинематическую траекторию."], "fix": false}]}, {"id": 22, "p": "ОБЩИЕ СВЕДЕНИЯ О РАДИОЛОКАЦИИ\nРадиолокацией называется область радиотехники, которая использует отражение, переизлучение или собственные излучения электромагнитных радиоволн для обнаружения различных целей (объектов), а также для измерения их координат и параметров движений.\nПод радиолокационной целью понимают любой материальный объект, который можно обнаружить, измерить его местоположение и параметры движения методами радиолокации.\nСовокупность сведений о целях, получаемых средствами радиолокации, называют радиолокационной информацией.\nТехнические средства получения радиолокационной информации называют радиолокационными станциями (РЛС) или радиолокаторами. С помощью РЛС могут быть обнаружены самолеты, ракеты, искусственные спутники Земли, танки, корабли, облака, планеты, ориентиры на местности и т.д.\nВ радиолокации используют свойства радиоволн и закономерности их распространения. Физические основы для создания РЛС были открыты русским изобретателем радио А.С. Поповым в 1897 году. Его опыты привели к мысли о возможности использования радиоволн для обнаружения объектов и измерения направления на объекты.\nВ настоящее время существуют радиолокационные станции самого различного назначения, но в основе работы каждой из них лежат следующие три положения.\n1.\t Объект, облученный радиоволнами, отражает электромагнитную энергию.\n2.\t Радиоволны распространяются в пространстве прямолинейно и с постоянной скоростью.\n3.\t Антенна радиолокационной станции обладает направленным излучением и приемом электромагнитной энергии.\nСовременная радиолокационная станция представляет собой сложное радиотехническое устройство. В передатчике осуществляется кратковременная генерация колебаний сверхвысокой частоты, которые поступают в антенну направленного действия. Антенна излучает электромагнитную энергию в определенном направлении в виде так называемых зондирующих радиоимпульсов.\nРадиоимпульсы распространяются в пространстве со скоростью света и, дойдя до цели, облучают ее; при этом происходит отражение радиоволн. Практически заметное отражение радиоволн от цели получается в том случае, когда ее линейные размеры превышают длину волны радиолокатора. Отраженные радиоволны распространяются во всех направлениях, часть их доходит до антенны радиолокационной станции, которая при помощи автоматического антенного переключателя подключается к приемнику сразу после излучения зондирующего радиоимпульса.\nПоданные на вход приемника слабые отраженные радиоимпульсы усиливаются и преобразуются в видеоимпульсы, форма которых близка к прямоугольной. С выхода приемника видео-импульсы поступают на индикатор, где воспроизводятся на экране электронно-лучевой трубки.\nУгловые координаты цели определяют по положению антенны, которая может перемещаться как по азимуту, так и по углу места. Азимут - это угол в горизонтальной плоскости, отсчитываемый от условного направления, принятого за нулевое, до направления на цель. Угол места - это угол в вертикальной плоскости, отсчитываемый от горизонта до направления на цель. Зная наклонную дальность и угол места, можно определить высоту цели. Точность определения координат цели зависит от формы характеристики направленности антенны и повышается с укорочением излучаемых радиоволн. Это служит одной из причин дальнейшего освоения радиолокацией все более коротких волн.", "qs": [{"q": "Что называется радиолокацией?", "o": ["Радиолокацией называется область радиотехники, которая использует отражение, переизлучение или собственные излучения электромагнитных радиоволн для обнаружения различных целей (объектов), а также для измерения их координат и параметров движений.", "Радиолокацией называется область радиотехники, которая использует отражение, переизлучение или собственные излучения электромагнитных радиоволн для слежения различных целей (объектов), а также для принятия их координат и параметров движений.", "Радиолокацией называется область радиотехники, которая изучает радиоволны, распространяющиеся в пространстве прямолинейно и с постоянной скоростью.", "Радиолокацией называется область радиотехники, которая представляет собой сложное радиотехническое устройство."], "fix": false}, {"q": "Что можно обнаружить с помощью РЛС?", "o": ["С помощью РЛС могут быть обнаружены самолеты, ракеты, искусственные спутники Земли, танки, корабли, облака, планеты, ориентиры на местности и т.д.", "С помощью РЛС можно обнаружить радиолокационной информации.", "С помощью РЛС невозможно обнаружить предмета.", "С помощью РЛС можно обнаружить русского изобретателя радио А.С. Попового в 1897 году."], "fix": false}, {"q": "Как определяют угловые координаты цели?", "o": ["Угловые координаты цели определяют по положению антенны, которая может перемещаться как по азимуту, так и по углу места.", "Угловые координаты цели определяют по наклонной дальности и углу места цели.", "Угловые координаты цели определяют как сумму азимута и угла места.", "Угловые координаты цели определяют с помощью приемника видео-импульсов, которые поступают на индикатор, где воспроизводятся на экране электронно-лучевой трубки."], "fix": false}, {"q": "От чего зависит точность определения координат цели?", "o": ["Точность определения координат цели зависит от формы характеристики направленности антенны и длины излучаемых радиоволн.", "Точность определения координат цели зависит от формы характеристики направленности антенны и диаметра электронно-лучевой трубки.", "Точность определения координат цели зависит от положения антенны, которая может перемещаться как по азимуту, так и по углу места", "Точность определения координат цели зависит от вида радиолокационных техник"], "fix": false}, {"q": "Что представляют собой современные РЛС?", "o": ["Современные РЛС представляют собой сложные радиотехнические комплексы, которые содержат устройства автоматики и вычислительной техники.", "Современные РЛС представляют собой технику, которая используется главным образом для своевременного обнаружения самолетов, самолетов-снарядов и ракет.", "Современные РЛС представляют собой сложные радиотехнические комплексы, которые содержат устройства определения координат цели.", "Современные РЛС представляют собой сложные комплексы, которые используются для управления истребителями, реактивными снарядами и ракетами, при помощи которых ведется борьба со средствами воздушного нападения."], "fix": false}]}, {"id": 23, "p": "Назначение в принцип действия автопилота ракеты\nАвтопилот предназначен для стабилизации ракеты на траектории относительно центра тяжести и продольной оси, а также для управления ее полётом в соответствии с командами наземной станции наведения, поступающими через бортовую радиоаппаратуру управлении.\nСтабилизация относительно центра тяжести и управление ракетой производятся в двух взаимно-перпендикулярных плоскостях с помощью рулей, расположенных в передней части ракеты. В установившемся полёте ракета ориентирована по крыльям и рулям в схеме «X» .\nСтабилизация ракеты относительно продольной оси (по крену) осуществляется с помощью двух элеронов, расположенных на задних кромках правого верхнего и левого нижнего крыльев.\nВ соответствии с назначением автопилот имеет три самостоятельных канала: два канала управления - I и II и канал крена - III.\nРаботу автопилота в полёте можно разделить на следующие основные этапы:\nстартовый участок,\nмомент сброса ускорителя,\nпосле начала радиоуправления.\nНа стартовом участке полёта - с момента схода с пусковой установки до сброса ускорителя - автопилот осуществляет стабилизацию ракеты относительно центра тяжести и обеспечивает управление ее полётом по прямолинейной траектории проходящей в направления выстрела, что необходимо для встреливания в луч наземной станции наведения.\nНа этом участке перед автопилотом не ставится задача стабилизации ракеты по крену и согласования осей координат ракеты и наземной станции наведения, поэтому углы крена несмотря на работу автопилота могут достигать больших значений из-за недостаточной эффективности элеронов. В этом случае автопилот лишь ограничивает максимальные углы вращения ракеты по крену и создает тем самым благоприятные условия для работы автопилота непосредственно после сброса ускорителя.\nВ момент сброса ускорителя I и II каналы автопилота подготавливаются для приема команд от бортовой радиоаппаратуры управления и прекращают автономное управление полетом ракеты по прямолинейной траектории, стабилизация ракеты относительно центра тяжести продолжает осуществляться автопилотом в соответствии с новыми условиями, имеющими место после сброса ускорителя.\nС момента сброса ускорителя до начала радиоуправления с бортовой радиоаппаратуры поступает на автопилот нулевая команда.\nПосле сброса ускорителя происходит согласование координатных осей ракеты и наземной станции наведения путем разворота ракеты по крену до совмещения ее оси ОУ с вертикальной плоскостью выстрела. Переходные процессы по крену заканчиваются через 0,5÷1,0 сек после сброса ускорителя, после чего ракета стабилизируется по крену с точностью необходимой для работы радиолиний управления и визирования.\nПосле начала радиоуправления автопилот управляет полетом ракеты в двух взаимно-перпендикулярных плоскостях в соответствии с командами поступающими от бортовой радиоаппаратуры управления. Одновременно продолжается стабилизация ракеты относительно центра тяжести и относительно продольной оси.", "qs": [{"q": "Каково назначение автопилота ракеты?", "o": ["Автопилот предназначен для стабилизации ракеты на траектории относительно центра тяжести и продольной оси, а также для управления ее полётом в соответствии с командами наземной станции наведения, поступающими через бортовую радиоаппаратуру управлении.", "Автопилот предназначен для управления ее полётом в соответствии с командами наземной станции наведения, поступающими через бортовую радиоаппаратуру управлении.", "Автопилот предназначен для стабилизации ракеты на траектории относительно центра тяжести и продольной оси.", "Автопилот предназначен для управления полётом ракеты по прямолинейной траектории, проходящей в направления выстрела."], "fix": false}, {"q": "С помощью чего производится стабилизация ракеты по крену?", "o": ["Стабилизация ракеты по крену производится с помощью двух элеронов, расположенных на задних кромках правого верхнего и левого нижнего крыльев.", "Стабилизация ракеты по крену производится с помощью рулей, расположенных в передней части ракеты.", "Стабилизация ракеты по крену производится c помощью крыльев и рулей, расположенных по схеме «X».", "Стабилизация ракеты по крену производится с помощью двух элеронов, расположенных на задних кромках левого верхнего и правого нижнего крыльев."], "fix": false}, {"q": "На каком этапе автопилот ракеты обеспечивает управление ее полётом по прямолинейной траектории?", "o": ["На стартовом участке полёта", "В момент сброса ускорителя", "После начала радиоуправления.", "Ни на каком этапе автопилот ракеты не обеспечивает управление ее полётом по прямолинейной траектории."], "fix": false}, {"q": "Сколько времени длится переходный процесс по крену?", "o": ["0,5÷1,0 сек.", "0,5сек.", "1,0 сек.", "1,5 сек."], "fix": false}, {"q": "На каком этапе перед автопилотом не ставится задача стабилизации ракеты по крену и согласования осей координат ракеты и наземной станции наведения?", "o": ["На стартовом участке полёта", "В момент сброса ускорителя", "После начала радиоуправления.", "На всем участке полёта перед автопилотом ставится задача стабилизации ракеты по крену и согласования осей координат ракеты и наземной станции наведения."], "fix": false}]}, {"id": 24, "p": "Назначение и состав автопилота ракеты\nАвтопилот предназначен для стабилизации ракеты на траектории относительно центра тяжести и продольной оси, а также для управления её полётом в соответствии с командами наземной станции наведения, поступающими через бортовую радиоаппаратуру управлении.\nАвтопилот ракеты состоит из трех независимых каналов: I и II каналов управления и III - канал стабилизации по крену.\nКаналы I и II одинаковы как по составу так и по принципу действия и включают в себя следующие функциональные элементы:\nдатчик угловой скорости;\nрешающий усилитель;\nусилитель мощности;\nструйное реле;\nрулевую машину с потенциометром обратной связи;\nкинематику с пружинным механизмом и рулями (последняя группа элементов являются частью конструкции ракеты).\nЭлементы выполняют следующие функции:\nдатчик угловой скорости (демпфирующий гироскоп) обеспечивает формирование устойчивых контуров управления и стабилизации ракеты по каналам I и II на всех режимах полёта. Кроме того, при полёте с ускорителем, по сигналу с датчика, преобразованном в решающем усилителе, производится управление прямолинейным полётом ракеты;\nрешающий усилитель при полёте с ускорителем интегрирует сигналы с датчика угловой скорости, обеспечивая тем самым управление по углу отклонения ракеты от траектории, при полёте после сброса ускорителя он становится масштабным усилителем напряжения, суммирующим команду радиоуправления с сигналом датчика угловых скоростей;\nусилитель мощности, струйное реле и рулевая машина с потенциометром обратной связи образуют рулевой тракт канала автопилота;\nкинематика с пружинным механизмом, передавая движение штока на рули, в то же время производит коррекцию отклонения рулей в зависимости от приложенных к ним в полёте шарнирных моментов.\nКанал III - стабилизации ракеты по крену включает в себя:\nдатчик утла крена;\nдатчик угловой скорости относительно продольной оси;\nусилитель мощности;\nструйное реле;\nрулевую машину с потенциометром обратной связи,\nкинематику с пружинный механизмом и элеронами (последняя группа элементов является частью конструкции ракеты).\nЭлементы III канала автопилота имеют следующее назначение:\nдатчик угла крена (свободный гироскоп) является элементом, с которого снимается сигнал, соответствующий текущему крену ракеты, необходимый для стабилизации её относительно продольной оси;\nдатчик угловой скорости обеспечивает формирование устойчивого контура стабилизации по крену и улучшает качество переходных процессов, возникающих при внешних возмущениях;\nназначение остальных элементов канала крена аналогично назначению соответствующих элементов каналов управления.", "qs": [{"q": "Из чего состоит автопилот ракеты?", "o": ["Автопилот ракеты состоит из трех независимых каналов: I и II каналов управления и III - канала стабилизации по крену.", "Автопилот ракеты состоит из:\nдатчика угловой скорости;\nрешающего усилителя;\nусилителя мощности;\nструйного реле;\nрулевой машины с потенциометром обратной связи;\nкинематики с пружинным механизмом и рулями.", "Автопилот ракеты состоит из:\nдатчика утла крена;\nдатчика угловой скорости относительно продольной оси;\nусилитела мощности;\nструйного реле;\nрулевой машины с потенциометром обратной связи;\nкинематики с пружинный механизмом и элеронами.", "Автопилот ракеты предназначен для стабилизации ракеты на траектории относительно центра тяжести и продольной оси, а также для управления её полётом."], "fix": false}, {"q": "Какой канал используется для стабилизации ракеты по крену?", "o": ["Канал III", "Канал I", "Канал I", "Канал I и Канал II"], "fix": false}, {"q": "Для чего нужен демпфирующий гироскоп?", "o": ["Демпфирующий гироскоп нужен для формирования устойчивых контуров управления и стабилизации ракеты по каналам I и II на всех режимах полёта.", "Демпфирующий гироскоп нужен для интегрирования сигналов с датчика угловой скорости, обеспечивая тем самым управление по углу отклонения ракеты от траектории.", "Демпфирующий гироскоп нужен для суммирования команды радиоуправления с сигналом датчика угловых скоростей.", "Демпфирующий гироскоп нужен для образования сигнала, соответствующего текущему крену ракеты, необходимого для стабилизации её относительно продольной оси"], "fix": false}, {"q": "Что входит в состав рулевого тракта канала автопилота?", "o": ["Усилитель мощности, струйное реле и рулевая машина с потенциометром обратной связи.", "Струйное реле, рулевая машина с потенциометром обратной связи и\nкинематика с пружинным механизмом и рулями.", "Струйное реле, рулевая машина с потенциометром обратной связи и кинематика с пружинный механизмом и элеронами.", "Датчика угловой скорости относительно продольной оси, усилитель мощности, струйное реле."], "fix": false}, {"q": "Как проводится коррекция отклонения рулей в зависимости от приложенных к ним в полёте шарнирных моментов?", "o": ["С помощью кинематики с пружинным механизмом.", "С помощью усилителя мощности.", "С помощью решающего усилителя.", "С помощью демпфирующего гироскопа."], "fix": false}]}, {"id": 25, "p": "Назначение и принцип действии радиовзрывателя ракеты\nРадиовзрыватель является неконтактным радиолокационным взрывателем, предназначенным для детонации боевой части в момент обеспечивающий наибольшую вероятность поранения цели боевой частью. В случае промаха взрыватель обеспечивает самоликвидацию ракеты. Взрыватель безопасен в служебном обращении (эксплуатации и транспортировке).\nРабота радиовзрывателя основана на импульсном принципе действия в сантиметровом диапазоне волн. Радиовзрыватель осуществляет детонацию боевой части при попадании цели в его зону срабатывании.\nВзрыватель состоит из следующих основных частей:\nимпульсного передающего устройства;\nпередающей антенны;\nдвух приемных антенн;\nдвух смесителей;\nгетеродина;\nусилителя промежуточной частоты и видеоусилителя;\nисполнительно-защитного устройства;\nблока питания;\nпредохранительно-исполнительного механизма.\nПередатчик вырабатывает высокочастотные импульсы, которые через передающую антенну излучаются в пространство. Передатчик состоит из задающего генератора, модулятора и генератора высокой частоты.\nВ качестве высокочастотного генератора применен малогабаритный триод «маячкового» типа с объёмными контурами.\nОтраженные от цели высокочастотные сигналы принимаются двумя приемными антеннами. Применение двух приемных антенн обеспечивает получение равномерной диаграммы направленности приема.\nС приёмных антенн отраженные сигналы поступают на смесители, где смешивается с колебаниями гетеродинам и преобразуются в импульсы промежуточной частоты. Для обеспечения стабильности промежуточной частоты гетеродин выполнен по схеме, аналогичной схеме передатчика. Со смесителей сигнал промежуточной частоты подается на вход усилителя промежуточной частоты (УПЧ).\nС выхода УПЧ импульсы поступают на видеоусилитель, где увеличиваются до требуемой величины. С выхода видеоусилителя импульсы поступают на основной канал - исполнительно-защитное устройство и на вспомогательный противопомеховый канал.\nИсполнительно-защитное устройство формирует из импульсов, отраженных от цели, нормированные по длительности и амплитуде импульсы и накапливает их.\nПри определенной величине накопленной энергии поджигается исполнительный тиратрон. \nВспомогательный противопомеховый канал применен для повышения помехоустойчивости. В случае действия помехи эта схема даёт возможность понижать усиление приемника в зависимости от величины помехи.\nРадиовзрыватель имеет блок питания, выдающий необходимые напряжения. Питающие напряжения на все узлы радиовзрывателя за исключением, задающего генератора передатчика, подаются во время старта.\nНапряжение на задающий генератор подается на траектории по команде дальнего взведения (команда К3) от системы наведения, и в то не время начинается излечение высокочастотной энергии передатчиком. \nОсновные технические данные.\nИмпульсная мощность 200 вт;\nСредняя частота повторения 5 кГц;\nДлительность импульса 0,07 - 0,08 мксек;\nПотребляемая мощность по цепи 115в, 1000 Гц не болое 150 ва.", "qs": [{"q": "Что представляет собой радиовзрыватель?", "o": ["Радиовзрыватель представляет собой неконтактный радиолокационный взрыватель, предназначенный для детонации боевой части.", "Радиовзрыватель является контактным радиолокационным взрывателем, предназначенным для детонации боевой части.", "Радиовзрыватель является неконтактным радиолокационным взрывателем, предназначенным для самоликвидации ракеты.", "Радиовзрыватель безопасен в служебном обращении (эксплуатации и транспортировке)."], "fix": false}, {"q": "На чем основана работа радиовзрывателя?", "o": ["Работа радиовзрывателя основана на импульсном принципе действия в сантиметровом диапазоне волн.", "Работа радиовзрывателя основана на импульсном принципе действия в дециметровом диапазоне волн.", "Работа радиовзрывателя основана на детонации боевой части при попадании цели в его зону срабатывании.", "Работа радиовзрывателя основана на том, что в случае промаха взрыватель обеспечивает самоликвидацию ракеты."], "fix": false}, {"q": "Что не входит в состав взрывателя?", "o": ["Боевая часть", "Передающая антенна", "Импульсное передающее устройство", "Предохранительно-исполнительный механизм."], "fix": false}, {"q": "Что применяется в качестве высокочастотного генератора?", "o": ["В качестве высокочастотного генератора применяется малогабаритный триод «маячкового» типа с объёмными контурами.", "В качестве высокочастотного генератора применяется малогабаритный тиратрон «маячкового» типа с объёмными контурами.", "В качестве высокочастотного генератора применяется малогабаритный триод типа импульсного передающего устройства.", "В качестве высокочастотного генератора применяется усилитель промежуточной чистоты (УПЧ)."], "fix": false}, {"q": "На какие узлы радиовзрывателя питающие напряжения не подаются во время старта?", "o": ["На задающий генератор передатчика.", "На модулятор генератора высокой частоты.", "На передающую антенну.", "На приемные антенны."], "fix": false}]}, {"id": 26, "p": "Зенитный ракетный комплекс SPYDER\nМобильный зенитный ракетный комплекс (ЗРК) SPYDER ближнего и среднего радиуса действия предназначен для противовоздушной обороны подразделений сухопутных войск и объектов инфраструктуры (командных пунктов, узлов связи, радиотехнических средств, мостов, аэродромов) от ударов самолетов, вертолетов, крылатых ракет и беспилотных летательных аппаратов. Комплекс обеспечивает поражение одиночных и групповых целей в любое время суток и любых климатических условиях.\n\nТиповая батарея комплекса среднего радиуса действия SPYDER-MR включает:\nКомандный пункт,\nЧетыре пусковые установки,\nТранспортно-заряжающие машины.\nПусковая установка (ПУ) предназначена для размещения, транспортировки, предварительного наведения и наклонного пуска четырех зенитных ракет Derby и Python-5 в различном сочетании. ПУ выполнена по модульному принципу и может размещаться на различных автомобильных шасси повышенной проходимости. Пуск ракет осуществляется непосредственно из контейнеров, которые служат также для их транспортировки и хранения. Пакет пусковых контейнеров располагается на поворотной платформе и с помощью гидравлических приводов может наводиться в горизонтальной и вертикальной плоскостях. В походном положении направляющие располагаются горизонтально. Для повышения живучести ракетного комплекса ПУ может размещаться на удалении от командного пункта батареи. Обмен информацией при этом может быть организован по кабельной, волоконнооптической  или беспроводной линии связи.  При автономной работе ПУ может использоваться оптическая система обнаружения TOPLITE. Расчет пусковой установки -  3 чел.  \nЗУР Derby и Python-5 в составе комплекса SPYDER-SR могут применяться в режиме захвата цели головкой самонаведения (ГСН) ракеты перед пуском (при нахождении ракет на ПУ) и после пуска. В последнем случае до захвата цели головкой самонаведения ракета управляется инерциальной системой управления до данным первичного целеуказания, переданным на ракету. Линия передачи данных используется для передачи команд коррекции на ракету на среднем участке траектории до захвата цели ГСН.  Темп стрельбы составляет две секунды.\n\nКомандный пункт (КП) оснащен трехкоординатной радиолокационной станцией обнаружения Elta EL/M-2106NG ATAR 3D . РЛС позволяет обнаруживать и сопровождать до шестидесяти целей на дальности до 35км. КП обеспечивает возможность ведения боевых действий в едином информационном пространстве эшелонированной системы Противовоздушной обороны и может получать целеуказания от внешних источников. В кабине управления размещены рабочие места двух операторов, оснащенные жидкокристаллическими мониторами.", "qs": [{"q": "Для поражения каких целей ЗРК SPYDER ближнего и среднего радиуса действия предназначен?", "o": ["Для поражения самолетов, вертолетов, крылатых ракет и беспилотных летательных аппаратов.", "ЗРК SPYDER ближнего и среднего радиуса действия предназначен для поражения самолетов, вертолетов, крылатых ракет и надводных целей.", "ЗРК SPYDER ближнего и среднего радиуса действия предназначен для поражения только групповых целей в любое время суток и любых климатических условиях.", "Для поражения самолетов, вертолетов, крылатых ракет и беспилотных летательных аппаратов только в светлое время суток"], "fix": false}, {"q": "Что не входит в состав комплекса среднего радиуса действия SPYDER-MR?", "o": ["Антенный пост УНВ.", "Командный пункт.", "Транспортно-заряжающие машины.", "Четыре пусковые установки."], "fix": false}, {"q": "Для чего предназначена пусковая установка ЗРК SPYDER-MR?", "o": ["Для размещения, транспортировки, предварительного наведения и наклонного пуска четырех зенитных ракет Derby и Python-5 в различном сочетании.", "Для размещения, транспортировки, предварительного наведения и наклонного пуска шести зенитных ракет Derby и Python-5 в различном сочетании.", "ПУ выполнена по модульному принципу и может размещаться на различных автомобильных шасси повышенной проходимости.", "Для поражения групповых целей в любое время суток и любых климатических условиях."], "fix": false}, {"q": "Когда ЗУР Python-5 может применяться в режиме захвата цели ГСН ракеты?", "o": ["Перед пуском (при нахождении ракет на ПУ) и после пуска", "Только после пуска ракеты", "Только перед пуском", "Перед пуском (при отсутствии ракет на ПУ) и после пуска"], "fix": false}, {"q": "Сколько целей РЛС позволяет обнаруживать и сопровождать?", "o": ["60", "35", "40", "50"], "fix": false}]}, {"id": 27, "p": "Зенитный ракетный комплекс средней дальности 9К317М \"Бук-М3\"\n9K317M «Бук-M3» (9K37M3) — комплекс ПВО сухопутных войск средней дальности, предназначенный для борьбы с маневрирующими аэродинамическими целями, тактическими баллистическими, крылатыми, авиационными ракетами и другими элементами высокоточного оружия, а также для поражения радиоконтрастных наземных и надводных целей в условиях интенсивного огневого и радиоэлектронного противодействия противника. Комплекс предназначен для круглогодичной, круглосуточной эксплуатации в любых климатических зонах.\n\nКомплекс 9К317М «Бук-М3″ был принят на вооружение в 2016 году, впервые продемонстрирован в рамках закрытого показа на Международном военно-техническом форуме «Армия – 2016» в Кубинке. В октябре 2016 г. вооруженным силам  России поставлен первый дивизион ЗРК \"Бук-М3\".\nСостав комплекса 9К317 \"Бук-М3\":\nПункт боевого управления (ПБУ) 9С510М;\nРадиолокационная станция обнаружения целей 9С18М3;\nДо шести автономных самоходных огневых установок (СОУ) 9А317М или РЛС подсвета и наведения (РПН) 9С36М в любом сочетании;\nДо двенадцати пусковых установок (ПУ) 9А316М;\nТранспортно-заряжающие машины (ТЗМ) 9Т243М\nКаждой СОУ 9А317М может придаваться одна ПУ 9А316М, РПН 9С36М - две ПУ 9А316М.\nПо сравнению с ЗРК \"Бук-М2\" в 1,5 раза увеличены: возимый боекомплект, зоны поражения, количество одновременно обстреливаемых целей. Повышены помехозащищенность и живучесть комплекса, а также его эксплуатационные характеристики. В полной комплектации комплекс обеспечивает одновременный обстрел до тридцати шести воздушных целей, летящих с любых направлений.\nПункт боевого управления 9С510М обеспечивает одновременную обработку информации о воздушной обстановке по данным собственных средств обнаружения целей и по данным от вышестоящих командных пунктов и придаваемых средств разведки. Количество выдаваемых целеуказаний до 36. Выполнен на шасси ГМ-5969.", "qs": [{"q": "Для поражения каких целей используется ЗРК \"Бук-М3\"?", "o": ["Для борьбы с маневрирующими аэродинамическими целями, тактическими баллистическими, крылатыми, авиационными ракетами и другими элементами высокоточного оружия, а также для поражения радиоконтрастных наземных и надводных целей в условиях интенсивного огневого и радиоэлектронного противодействия противника.", "Для поражения только радиоконтрастных наземных и надводных целей в условиях интенсивного огневого и радиоэлектронного противодействия противника.", "Для поражения радиоконтрастных наземных и надводных целей в условиях отсутствия интенсивного огневого и радиоэлектронного противодействия противника.", "Для борьбы только с маневрирующими аэродинамическими целями, тактическими баллистическими, крылатыми, авиационными ракетами и другими элементами высокоточного оружия."], "fix": false}, {"q": "Когда комплекс 9К317М «Бук-М3″ был принят на вооружение?", "o": ["В 2016 году.", "До 2016 г.", "В 2015 году.", "На международном военно-техническом форуме «Армия – 2016» в Кубинке"], "fix": false}, {"q": "Сколько воздушных целей комплекс в полной комплектации может одновременно обстрелять?", "o": ["36", "6", "12", "24"], "fix": false}, {"q": "Что не увеличено в 1,5 раза по сравнению этого комплекса с ЗРК \"Бук-М2\"?", "o": ["Транспортно-заряжающие машины", "Возимый боекомплект", "Зоны поражения", "Количество одновременно обстреливаемых целей"], "fix": false}, {"q": "По каким данным Пункт боевого управления 9С510М обеспечивает одновременную обработку информации о воздушной обстановке?", "o": ["По данным от вышестоящих командных пунктов и придаваемых средств разведки и по данным собственных средств обнаружения целей.", "По данным собственных средств обнаружения целей и по данным спутниковой системы навигации.", "По данным собственных средств обнаружения целей и по данным –от транспортно-заряжающих машин.", "По данным радиолокационной станции обнаружения целей 9С18М3 и по данным спутниковой системы навигации."], "fix": false}]}, {"id": 28, "p": "Противотанковый ракетный комплекс \"Малютка\" (9К14/9К11)\nПТРК \"Малютка\" предназначен для борьбы с бронированными целями, разрушения укрытий и уничтожения огневых средств и точек противника. Разработан в КБМ (г.Коломна) под руководством главного конструктора С.Н. Непобедимого в 1960 году. Переносной вариант комплекса 9К11, а также созданный в инициативном порядке макетный образец боевой машины 9П110 прошли большой объем испытаний с пусками ракет в 1961 году и 16 сентября 1963 г. были приняты на вооружение.\nРакета 9М14 состоит из пристыковываемых перед пуском боевой части 9Н110 и крыльевого отсека. Соединение их производится очень быстро, с использованием специальных замков. В крыльевом отсеке по оси последовательно располагаются - маршевый двигатель, рулевая машинка и гироскоп. В кольцевом пространстве вокруг маршевого двигателя размещается камера сгорания стартового двигателя с многошашечным зарядом, а за ней - катушка проводной линии связи. На наружной поверхности корпуса ракеты установлен трассер.\nРакета 9М14 оснащена одноканальной системой управления. На ракете установлена всего одна рулевая машинка, перемещающая насадки (дефлекторы) на двух противоположных косонаправленных соплах маршевого двигателя. При этом попеременно осуществляется управление по тангажу и курсу, так как ракета в полете вращается относительно продольной оси с постоянной угловой скоростью - 8.5 оборотов в секунду. Первоначальный проворот по крену придается при работе стартового двигателя с соответствующей ориентацией осей сопл. Далее вращение поддерживается за счет установки плоскости крыльев под углом к продольной оси ракеты. Для увязки углового положения ракеты с наземной системой координат используется трехстепенной гироскоп с механической раскруткой, осуществляемой в процессе старта посредством ленты. На ракете отсутствуют бортовые источники электропитания, а единственная рулевая машинка работает от тока, поступающего от наземной аппаратуры по одной из цепей водостойкого трехжильного провода.\nКрылья ракеты в транспортном положении складываются навстречу друг другу, так что поперечные габариты не превышают 185х185мм при размахе разложенного крыла 393мм.\nДля переносного комплекса 9К11 переноска ракеты с пусковой направляющей осуществляется в заплечном чемодане-ранце 9П111. В боевом положении корпус чемодана-ранца служит основанием пусковой установки. Два бойца противотанкового расчета несут вьюки №2 и №3 - чемоданы-ранцы с ракетами весом 18.1кг и пусковыми установками, а командир расчета, он же старший оператор (наводчик), несет вьюк №1 - пульт управления 9С415 с монокулярным визиром 9Ш16 и аппаратурой наведения, весом 12.4кг. Оптический визир имеет восьмикратное увеличение, только дневной режим, поле зрения 22.5°.\nРазработчики комплекса придавали большое внимание снижению трудоемкости изготовления ракеты и снижению ее стоимости. В корпусе боевой части и крыльевого отсека широко использовались пластмассы, из стеклопластика изготавливался чемодан-ранец для переноски ракеты.", "qs": [{"q": "Для поражения каких целей используется Противотанковый ракетный комплекс \"Малютка\"?", "o": ["Для поражения бронированных целей, разрушения укрытий и уничтожения огневых средств и точек противника.", "Для борьбы с маневрирующими аэродинамическими целями, разрушения укрытий и уничтожения огневых средств и точек противника", "Для борьбы с маневрирующими аэродинамическими целями на малых и средних высотах в условиях радиопротиводействия", "Для борьбы с тактическими баллистическими, авиационными ракетами и другими элементами высокоточного оружия в полете"], "fix": false}, {"q": "Когда комплекс был принят на вооружение?", "o": ["В 1963 г.", "В 1960 г.", "В 1961 г.", "В 1962 г."], "fix": false}, {"q": "Какой источник электропитания для рулевой машины ракеты?", "o": ["Источник от наземной аппаратуры по одной из цепей водостойкого трехжильного провода.", "Бортовые источники электропитания", "Источники электропитания на борту ракеты", "Солнечный источник"], "fix": false}, {"q": "Какой режим видения для оптического визира ракеты?", "o": ["Дневной режим", "Ночной режим", "Дневной и ночной режим", "Универсальный режим"], "fix": false}, {"q": "Из чего изготовлен чемодан-ранец для переноски ракеты?", "o": ["Из стеклопластика", "Из алюминиевого сплава", "Из медного сплава", "Из стали"], "fix": false}]}, {"id": 29, "p": "Зенитный ракетный комплекс С-400 'Триумф'\nЗенитный ракетный комплекс С-400 \"Триумф\" предназначен для поражения самолетов-постановщиков помех, самолетов радиолокационного обнаружения и управления, самолетов-разведчиков, самолетов стратегической и тактической авиации, тактических, оперативно-тактических баллистических ракет, баллистических ракет средней дальности, гиперзвуковых целей и других современных и перспективных средств воздушного нападения.\nЗРК С-400 создан на базе существующих российских комплексов С-300, однако, обладает значительно большими тактико-техническими возможностями в сравнении с этими системами - и по зоне, и по эффективности, и по многообразию поражаемых целей. Проведенные разработчиками комплекса оценки выявили, что по критерию \"эффективность - стоимость\" новый ЗРК обеспечивает выигрыш в 2,5 раза по сравнению с существующей техникой. \"Триумф\" - единственная система, которая может выборочно работать с использованием нескольких типов ракет - как старых, входивших в ранние разработки (С-300ПМУ-1, С-300ПМУ-2), так и новых, созданных в последнее время. Располагая в базовом варианте 4 типами ракет, обладающих различной стартовой массой и дальностью пуска, С-400 позволяет создавать эшелонированную противовоздушную оборону, расширить зоны поражения комплекса, а также имеет большие перспективы для дальнейшей модернизации.\nВысокая степень автоматизации всех этапов боевой работы, современная элементная база позволили значительно сократить обслуживающий персонал ЗРС С-400. Принципы построения и разветвленная система связи средств \"четырехсотки\" позволяют интегрировать ее в различные уровни управления не только ВВС, но и других видов Вооруженных Сил.\nЗенитная ракетная система С-400 принята на вооружение российской армии Постановлением Правительства РФ от 28 апреля 2007 г. 6 августа 2007 г. первый дивизион заступил на боевое дежурство в г.Электросталь Московской обл.\nНа западе комплекс получил обозначение SA-20.\nСостав: \nВ базовом варианте зенитного ракетного комплекса С-400 сохранилась структура ЗРК типа С-300, включающая многофункциональную РЛС, пусковые установки, автономные средства обнаружения и целеуказания. Вместе с тем, новый комплекс средств управления обеспечивает значительно большую канальность по целям.\nВ состав ЗРС \"Триумф\" входят:\n    Средства управления 30К6Е:\nПункт боевого управления 55К6Е;\nРЛС обнаружения 91Н6Е.\n    Зенитные ракетные комплексы 98Ж6Е (до 6 шт.) в составе:\nМногофункциональная РЛС управления 92Н2Е;\nПусковые установки 5П85ТЕ2 и/или 5П85СЕ2 (до 12 шт.)\nЗенитные ракеты 48Н6Е, 48Н6Е2, 48Н6Е3 существующих ЗРК С - 300ПМ - 1, - 2, а также ракеты 9М96Е и 9М96Е2 (см. фото) и ракета сверхбольшой дальности 40Н6Е.\n    Опционально придаваемые средства:\nВсевысотная РЛС 96Л6Е;\nПередвижная вышка 40В6М для антенного поста 92Н6Е.", "qs": [{"q": "Для поражения каких целей используется Зенитный ракетный комплекс С-400 \"Триумф\"?", "o": ["Для поражения тактических, оперативно-тактических баллистических ракет, баллистических ракет средней дальности, гиперзвуковых целей, самолетов-постановщиков помех, самолетов радиолокационного обнаружения и управления, самолетов-разведчиков, самолетов стратегической и тактической авиации и других современных и перспективных средств воздушного нападения.", "Для поражения самолетов-постановщиков помех, самолетов радиолокационного обнаружения и управления, самолетов-разведчиков, самолетов стратегической и тактической авиации, надводных и наземных радиоконтрастных целей.", "Для поражения оперативно-тактических баллистических ракет, баллистических ракет малой дальности, гиперзвуковых целей и надводных и наземных радиоконтрастных целей.", "Для поражения бронированных целей, разрушения укрытий и уничтожения огневых средств и точек противника."], "fix": false}, {"q": "На базе какого комплекса создан Зенитный ракетный комплекс С-400?", "o": ["На базе комплекса С-300.", "На базе комплекса С-125.", "На базе комплекса С-125-2ТМ.", "На базе комплекса С-200."], "fix": false}, {"q": "Во сколько раз по критерию \"эффективность - стоимость\" ЗРК С-400 обеспечивает выигрыш по сравнению с существующей техникой?", "o": ["2,5 раза", "2 раза", "3 раза", "4 раза"], "fix": false}, {"q": "Что не входит в состав Зенитных ракетных комплексов 98Ж6Е?", "o": ["Пункт боевого управления 55К6Е", "Многофункциональная РЛС управления 92Н2Е", "Пусковые установки 5П85ТЕ2", "Зенитные ракеты"], "fix": false}, {"q": "Какое количество пусковых установок имеет ЗРК С-400?", "o": ["До 12", "До 6", "До 4", "До 2"], "fix": false}]}, {"id": 30, "p": "Высокоточная крылатая ракета 3М-14Э\nВысокоточная крылатая ракета 3М-14Э предназначена для поражения в простых и сложных метеоусловиях днем и ночью стационарных (малоподвижных) наземных и морских целей. Типовыми целями для ракеты 3М-14Э являются наземные пункты управления войсками, склады вооружений и топлива, аэродромные и портовые сооружения.\nРакеты 3М14Э в различной конфигурации входят в состав:\nРакетного комплекса \"Калибр-ПЛЭ\" для вооружения подводных лодок (экспортное обозначение \"Club-S\"),\nРакетного комплекса \"Калибр-НКЭ\" для вооружения надводных кораблей (экспортное обозначение \"Club-N\").\nМобильного ракетного комплекса \"Калибр-М\" (экспортное обозначение \"Club-M\");\nКомплекса ракетного оружия авиационного базирования \"Калибр-А\" (\"Club-A\").\nИнтегрированные ракетные комплексы \"Калибр\" предназначены для поражения широкой номенклатуры наземных, морских надводных и подводных целей в условиях интенсивного огневого и радиоэлектронного противодействия противника. Все комплексы имеют единые боевые средства:\nПротивокорабельные ракеты 3М-54Э, 3М-54Э1,\nВысокоточные крылатые ракеты для поражения наземных целей 3М-14Э,\nПротиволодочные ракеты 91РЭТ2 (\"Калибр-НКЭ\") и 91РЭ1 (\"Калибр-ПЛЭ\")\nНаличие в составе систем \"Калибр\" ракет различного назначения, а также единая универсальная система управления (СУ) ракетным комплексом позволяет варьировать боекомплектом ракет на носителях в зависимости от поставленной задачи и конкретной боевой обстановки.\nРакеты комплекса \"Калибр-ПЛЭ\" стартуют из штатных торпедных аппаратов подводной лодки калибра 533 мм с глубины 30-40м, а комплекса \"Калибр-НКЭ\" - из подпалубных унифицированных вертикальных ПУ 3C-14Э или палубных наклонных ЗС-14ПЭ. Ракета 3М-14Э комплекса \"Калибр-НКЭ\" отличается наличием специального транспортно-пускового стакана и имеет обозначение 3М-14ТЭ. Испытания ракеты 3М-14Э в составе комплекса \"Калибр-ПЛЭ\" завершились 18.09.2004 в акватории Балтийского моря\n\nКомплекс ракетного оружия \"Калибр-А\" был впервые представлен на выставке IDEX-2007 (Абу-Даби, ОАЭ). Ракета 3М-14АЭ авиационного базирования входит в состав вооружения ударного самолета Су-35 (до 3 ед. на борту) и планируется для вооружения истребителя МиГ-35. 3М-14АЭ не имеет стартового двигателя и размещается в транспортно-пусковом контейнере, из которого и осуществляется старт после сброса с самолета-носителя.", "qs": [{"q": "Какие цели ракета 3М-14Э может уничтожить?", "o": ["Малоподвижные цели.", "Маневрирующие аэродинамические цели.", "Баллистические ракеты.", "Тактические ракеты."], "fix": false}, {"q": "Сколько комплексов ракета 3М14Э может входить в состав?", "o": ["4", "2", "3", "5"], "fix": false}, {"q": "Какой комплекс ракеты 3М14Э используется для вооружения надводных кораблей?", "o": ["Ракетный комплекс \"Калибр-НКЭ\"", "Комплекс ракетного оружия авиационного базирования \"Калибр-А\"", "Ракетный комплекс \"Калибр-ПЛЭ\"", "Мобильный ракетный комплекс \"Калибр-М\""], "fix": false}, {"q": "Когда завершились испытания ракеты 3М-14Э в составе комплекса \"Калибр-ПЛЭ\"?", "o": ["В 2004 г.", "В 2005 г.", "В 2006 г.", "В 2007 г."], "fix": false}, {"q": "Сколько ракет 3М-14АЭ на борту самолета Су-35?", "o": ["3", "2", "4", "6"], "fix": false}]}];
const $=id=>document.getElementById(id);
const store={get(){try{return JSON.parse(localStorage.getItem('tlpk_best')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('tlpk_best',JSON.stringify(v))}catch(e){}}};
let psT=0,fresh=true,col=false;let best=store.get(),cur=0,qs=[],ans=[],done=false,t0=0,tick=null,fs=17;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function grid(){const g=$('grid');g.innerHTML='';DATA.forEach((t,i)=>{const b=el('button','dv'+(i===cur?' on':'')+(best[t.id]!==undefined?' dn':''),t.id);b.title='Đề '+t.id+(best[t.id]!==undefined?' – điểm cao nhất '+best[t.id]+'/10':'');b.onclick=()=>start(i);g.appendChild(b)})}
function start(i){
  cur=i;done=false;ans=[];fresh=true;clearInterval(tick);t0=Date.now();$('tm').textContent='00:00';
  tick=setInterval(()=>{$('tm').textContent=fmt(Math.floor((Date.now()-t0)/1000))},1000);
  const sh=$('shuf').checked;
  qs=DATA[i].qs.map(q=>{const o=q.o.map((t,k)=>({t,ok:k===0}));return{q:q.q,o:(sh&&!q.fix)?shuffle(o):o}});
  grid();render();window.scrollTo({top:0});$('pick').textContent='Đề '+DATA[i].id+' ▾';closePk();
}
function render(){
  const m=$('main'),sy=window.scrollY;if(fresh){psT=0;fresh=false}else{const o=document.querySelector('.pt');psT=o?o.scrollTop:0}
  m.innerHTML='';const T=DATA[cur];const split=el('div','split'),qcol=el('div','qcol');
  if(done){qcol.appendChild(result())}
  const p=el('section','panel pcol'+(col?' cl':'')),ph=el('div','ph');ph.appendChild(el('h2','','Đề '+T.id+' – Văn bản'));
  {const tg=el('button','fz tg',col?'Mở rộng':'Thu gọn');tg.onclick=()=>{col=!col;p.classList.toggle('cl',col);tg.textContent=col?'Mở rộng':'Thu gọn'};ph.appendChild(tg)}
  [['A−',-1],['A+',1]].forEach(([l,d])=>{const b=el('button','fz',l);b.setAttribute('aria-label',d<0?'Giảm cỡ chữ':'Tăng cỡ chữ');b.onclick=()=>{fs=Math.max(14,Math.min(26,fs+d*2));document.querySelector('.pt').style.setProperty('--fs',fs+'px')};ph.appendChild(b)});
  const pt=el('div','pt',T.p);pt.lang='ru';pt.style.setProperty('--fs',fs+'px');p.append(ph,pt);split.append(p,qcol);m.appendChild(split);pt.scrollTop=psT;
  qs.forEach((q,qi)=>{
    const c=el('section','panel q');c.id='q'+qi;
    const h=el('div','qh');h.append(el('div','qn',qi+1),el('div','qt',q.q));c.appendChild(h);
    const g=el('div');g.setAttribute('role','radiogroup');g.setAttribute('aria-label','Câu '+(qi+1));
    q.o.forEach((o,oi)=>{
      const b=el('button','o');b.setAttribute('role','radio');b.setAttribute('aria-checked',ans[qi]===oi);
      if(done){b.setAttribute('aria-disabled','true');if(o.ok)b.classList.add('ok');else if(ans[qi]===oi)b.classList.add('no')}
      else if(ans[qi]===oi)b.classList.add('sel');
      b.append(el('span','l','ABCD'[oi]),el('span','',o.t));
      b.onclick=()=>{if(done)return;ans[qi]=oi;render();document.getElementById('q'+qi).scrollIntoView({block:'nearest'})};
      g.appendChild(b)});
    c.appendChild(g);
    if(done){const r=ans[qi]===undefined?null:q.o[ans[qi]].ok;c.appendChild(el('p','vd '+(r?'ok':'no'),r?'Chính xác':(r===null?'Chưa trả lời – đáp án đúng được tô xanh':'Chưa đúng – đáp án đúng được tô xanh')))}
    qcol.appendChild(c)});
  qcol.appendChild(bar());upd();if(!fresh)window.scrollTo(0,sy);
}
function bar(){
  const b=el('div','bar'),nv=el('div','nv');nv.appendChild(el('span','','Câu:'));
  qs.forEach((q,i)=>{const a=el('a',(done?(ans[i]!==undefined&&q.o[ans[i]].ok?'ok':'no'):(ans[i]!==undefined?'a':'')),i+1);a.href='#q'+i;a.onclick=e=>{e.preventDefault();$('q'+i).scrollIntoView({behavior:'smooth',block:'start'})};nv.appendChild(a)});
  b.appendChild(nv);
  if(!done){const s=el('button','btn p','Nộp bài');s.onclick=submit;b.appendChild(s)}
  else{const n=el('button','btn p','Đề tiếp theo');n.onclick=()=>start((cur+1)%DATA.length);b.appendChild(n)}
  return b;
}
function upd(){$('pg').style.width=(done?100:ans.filter(x=>x!==undefined).length/qs.length*100)+'%'}
function submit(){
  const n=ans.filter(x=>x!==undefined).length;
  if(n<qs.length&&!confirm('Còn '+(qs.length-n)+' câu chưa trả lời. Bạn vẫn muốn nộp bài?'))return;
  done=true;clearInterval(tick);
  const ok=qs.filter((q,i)=>ans[i]!==undefined&&q.o[ans[i]].ok).length,pt=ok*10/qs.length;
  const id=DATA[cur].id;if(best[id]===undefined||pt>best[id]){best[id]=+pt.toFixed(2);store.set(best)}
  render();window.scrollTo({top:0,behavior:'smooth'});
}
function result(){
  const ok=qs.filter((q,i)=>ans[i]!==undefined&&q.o[ans[i]].ok).length,pt=+(ok*10/qs.length).toFixed(2),pc=ok/qs.length*100;
  const s=el('section','panel rs');const r=el('div','ring');r.style.setProperty('--p',pc);r.style.setProperty('--c',pc>=80?'var(--ok)':pc>=50?'var(--ac)':'var(--no)');
  const d=el('div');d.innerHTML='<span></span><small>/10</small>';d.firstChild.textContent=pt;r.appendChild(d);
  const t=el('div');t.append(el('h2','','Kết quả Đề '+DATA[cur].id));
  t.append(el('p','',ok+'/'+qs.length+' câu đúng · thời gian '+$('tm').textContent+' · điểm cao nhất '+best[DATA[cur].id]+'/10'));
  const a=el('div','acts'),re=el('button','btn','Làm lại đề này');re.onclick=()=>start(cur);
  const rn=el('button','btn','Đề ngẫu nhiên');rn.onclick=()=>start(Math.floor(Math.random()*DATA.length));a.append(re,rn);t.appendChild(a);
  s.append(r,t);return s;
}
const pk=$('pick'),pp=$('pkp');
function closePk(){pp.classList.remove('open');pk.setAttribute('aria-expanded','false')}
pk.onclick=e=>{e.stopPropagation();pk.setAttribute('aria-expanded',pp.classList.toggle('open'))};
document.addEventListener('click',e=>{if(!pp.contains(e.target)&&e.target!==pk)closePk()});
addEventListener('keydown',e=>{if(e.key==='Escape')closePk()});
$('rnd').onclick=()=>start(Math.floor(Math.random()*DATA.length));
addEventListener('keydown',e=>{
  if(done||e.ctrlKey||e.metaKey||e.altKey)return;
  const k='abcd'.indexOf(e.key.toLowerCase());if(k<0||e.key.length!==1)return;
  const qi=ans.findIndex((x,i)=>x===undefined&&i<qs.length);if(qi<0)return;
  ans[qi]=k;render();const nx=ans.findIndex(x=>x===undefined);if(nx>=0)$('q'+nx).scrollIntoView({block:'center'});
});
start(0);
</script></body></html>
