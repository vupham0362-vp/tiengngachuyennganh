<style>
:root{--bg:#eef1f5;--pn:#fff;--tx:#17212d;--mu:#5b6877;--bd:#d5dbe3;--ac:#25618f;--acs:#e4eef7;--ok:#17703a;--oks:#e1f3e7;--no:#a52a22;--nos:#fbe6e3;--hd:#17212d;--hdt:#fff;--sh:0 1px 2px rgba(20,30,45,.08)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.hi h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:0}
.hi h1 small{display:block;font-weight:400;font-size:12px;opacity:.7}
.tm{font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;padding:4px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px}
.pb{height:4px;background:rgba(255,255,255,.18)}.pb i{display:block;height:100%;width:0;background:#6fb7ee;transition:width .25s}
.lay{max-width:1500px;margin:0 auto;padding:16px}
aside{display:none;position:absolute;right:16px;top:100%;width:300px;margin-top:6px;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.28)}aside.open{display:block}
.hb{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 12px;border-radius:6px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}

.pcol .pt{flex:1;overflow:auto;max-width:none}
.qcol{min-width:0}.q{scroll-margin-top:80px}.tg{display:none}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dv{aspect-ratio:1;border:1px solid var(--bd);background:var(--pn);border-radius:6px;font-weight:600;font-size:13px;position:relative}

.btn.p:hover{filter:brightness(1.1)}

.sw{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:13px}
.lg{font-size:12px;color:var(--mu);margin-top:12px}
.lg b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px}
main{min-width:0}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh);margin-bottom:14px}
.ph{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd)}
.ph h2{margin:0;font-size:15px;flex:1}
.fz{padding:4px 9px;border:1px solid var(--bd);background:none;border-radius:5px}
.pt{padding:16px 20px;font:var(--fs,17px)/1.7 Georgia,"Times New Roman",serif;white-space:pre-wrap;max-width:78ch}
.q{padding:16px}
.qh{display:flex;gap:10px;margin-bottom:10px}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px}
.qt{font-weight:600;font-size:16px}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:var(--pn);transition:background .12s,border-color .12s}
.o:hover{border-color:var(--ac)}
.o .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--mu)}
.o.sel{border-color:var(--ac);background:var(--acs)}
.o.sel .l{background:var(--ac);border-color:var(--ac);color:#fff}
.o.ok{border-color:var(--ok);background:var(--oks)}
.o.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.o.no{border-color:var(--no);background:var(--nos)}
.o.no .l{background:var(--no);border-color:var(--no);color:#fff}
.o[aria-disabled=true]{cursor:default}
.vd{margin:10px 0 0;font-size:13px;font-weight:600}.vd.ok{color:var(--ok)}.vd.no{color:var(--no)}
.bar{position:sticky;bottom:0;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.nv{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center}
.nv a{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:600;text-decoration:none;color:var(--tx)}
.nv a.a{background:var(--ac);border-color:var(--ac);color:#fff}
.nv a.ok{background:var(--ok);border-color:var(--ok);color:#fff}.nv a.no{background:var(--no);border-color:var(--no);color:#fff}
.nv span{font-size:13px;color:var(--mu);margin-right:4px}
.rs{display:flex;gap:20px;align-items:center;padding:18px 20px;flex-wrap:wrap}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--pn);display:grid;place-items:center;font-size:22px;font-weight:700;line-height:1}
.ring small{display:block;font-size:11px;font-weight:500;color:var(--mu);text-align:center}
.rs h2{margin:0 0 4px;font-size:18px}.rs p{margin:0;color:var(--mu)}
.rs .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media(max-width:900px){.split{grid-template-columns:1fr}.pcol{top:58px;z-index:3;height:auto;max-height:42vh;margin-bottom:12px}.pcol.cl .pt{display:none}.tg{display:inline-block}.q{scroll-margin-top:calc(70px + 42vh)}.hi h1 small{display:none}aside{right:8px;left:8px;width:auto}}

<script>
const DATA=[{"id": 1, "p": "Системы телеуправления\nСистемами телеуправления называются такие, в которых движение ракеты определяется наземным пунктом наведения, непрерывно контролирующим параметры траектории цели и ракеты. В зависимости от места формирования команд (сигналов) управления рулями ракеты эти системы делятся на системы наведения по лучу и командные системы телеуправления.\nВ системах наведения по лучу направление движения ракеты задается с помощью направленного излучения электромагнитных волн (радиоволн, лазерного излучения и др.). Луч модулируется таким образом, чтобы при отклонении ракеты от заданного направления ее бортовые устройства автоматически определяли сигналы рассогласования и вырабатывали соответствующие команды управления ракетой.\nПримером применения такой системы управления с телеориентированием ракеты в лазерном луче (после ее вывода в этот луч) является многоцелевой ракетный комплекс ADATS, разработанный швейцарской фирмой «Эрликон» совместно с американской «Мартин Мариэтта». Считается, что такой способ управления по сравнению с командной системой телеуправления первого вида обеспечивает на больших дальностях более высокую точность наведения ракеты на цель.\nВ командных системах телеуправления команды управления полетом ракеты вырабатываются на пункте наведения и по линии связи (линии телеуправления) передаются на борт ракеты. В зависимости от способа измерения координат цели и определения ее положения относительно ракеты командные системы телеуправления делятся на системы телеуправления первого вида и системы телеуправления второго вида. В системах первого вида измерение текущих координат цели осуществляется непосредственно наземным пунктом наведения, а в системах второго вида - бортовым координатором ракеты с последующей их передачей на пункт наведения. Выработка команд управления ракетой как в первом, так и во втором случае осуществляется наземным пунктом наведения.\nОпределение текущих координат цели и ракеты (например, дальности, азимута и угла места) осуществляется радиолокационной станцией сопровождения. В некоторых комплексах эта задача решается двумя радиолокаторами, один из которых сопровождает цель (радиолокатор визирования цели), а другой - ракету (радиолокатор 2 визирования ракеты).", "qs": [{"q": "Что непрерывно контролирует параметры траектории цели и ракеты в системах телеуправления?", "o": ["В системах телеуправления параметры траектории цели и ракеты непрерывно контролируются наземным пунктом наведения", "В системах телеуправления параметры траектории цели и ракеты непрерывно контролируются бортовыми устройствами.", "В системах телеуправления наземный пункт наведения периодически контролирует параметры траектории цели и ракеты.", "В системах телеуправления пусковая установка непрерывно контролирует параметры траектории цели и ракеты."], "fix": false}, {"q": "В зависимости от чего системы телеуправления делятся на системы наведения по лучу и командные системы?", "o": ["Системы телеуправления делятся на системы наведения по лучу и командные системы в зависимости от места формирования сигналов управления рулями ракеты.", "В зависимости от количества сигналов управления рулями ракеты системы телеуправления делятся на системы наведения по лучу и командные системы.", "Системы телеуправления делятся на системы наведения по лучу и командные системы в зависимости от параметров траектории цели и ракеты.", "В зависимости от положения наземного пункта наведения системы телеуправления делятся на системы наведения по лучу и командные системы."], "fix": false}, {"q": "Как определяется направление движения ракеты в системах наведения по лучу?", "o": ["В системах наведения по лучу направление движения ракеты определяется направленным излучением электромагнитных волн (радиоволн, лазерного излучения и др.).", "В системах наведения по лучу направление движения ракеты задается с помощью приемника электромагнитных волн (радиоволн, лазерного излучения и др.).", "В системах наведения по лучу направление движения ракеты определяется размером спектра электромагнитных волн (радиоволн, лазерного излучения и др.).", "Все ответы А, B и C правильные."], "fix": true}, {"q": "Какой вид системы телеуправления применяется у многоцелевого ракетного комплекса ADATS?", "o": ["У многоцелевого ракетного комплекса ADATS применяют систему наведения по лучу.", "У многоцелевого ракетного комплекса ADATS применяется командная система телеуправления первого вида.", "У многоцелевого ракетного комплекса ADATS применяется командная система телеуправления второго вида.", "У многоцелевого ракетного комплекса ADATS применяют систему самонаведения."], "fix": false}, {"q": "Чем отличается система телеуправления первого вида от системы телеуправления второго вида?", "o": ["Система телеуправления первого вида отличается от системы телеуправления второго вида местом измерения текущих координат цели", "Разница между системами телеуправления первого вида и второго вида заключает в месте обрабатывания текущих координат цели.", "Система телеуправления первого вида отличается от системы телеуправления второго вида местом выработки команд управления ракетой.", "Система телеуправления первого вида отличается от системы телеуправления второго вида способом передачи команд управления на борт ракеты."], "fix": false}]}, {"id": 2, "p": "Зенитный ракетный комплекс С-125 «Нева»\nЗенитный ракетный комплекс С-125 предназначен для поражения воздушных целей на малых и средних высотах. Комплекс всепогодный, способен поражать цели на встречных курсах и вдогон, в исключительных случаях обстреливать радиолокационно наблюдаемые наземные и надводные цели.\nДвухступенчатая твердотопливная ракета 5В24 выполнена по нормальной аэродинамической схеме. Управление ее полетом осуществляется с помощью команд, формируемых станцией наведения ракет и передаваемых по радиолинии управления на борт. Ракета имеет твердотопливный стартовый двигатель, время работы которого до сбрасывания - 2,6 с. Маршевый двигатель также твердотопливный, запускается после окончания работы стартового и работает 18,7 с. После сброса стартового ускорителя ракета начинает принимать команды управления для наведения в точку встречи с целью. Первая ступень (стартовый двигатель) представляет собой пороховой реактивный двигатель ПРД-36 (14 пороховых шашек общей массой 280 кг). Двигатель второй ступени представляет собой пороховую шашку весом 125 кг. На ракете используется доплеровский радиовзрыватель.\nВ 1964 г. на вооружение была принята новая ракета 5В27. Она отличалась от предыдущей конструкцией маршевого двигателя и имела новую более мощную боевую часть 5Б18 массой 72 кг. За счет этого увеличилась скорость ракеты и размеры зоны поражения.\nДля обнаружения и сопровождения воздушных целей, а также для передачи команд управления на ракету служит станция наведения ракет СНР-125, которая работает в I-диапазоне волн (8,9-9,46 ГГц). Она имеет антенны специальной конфигурации, расположенные таким образом, чтобы уменьшить влияние отражений от земли. Максимальная дальность обнаружения целей составляет 110 км. Ширина диаграммы направленности антенн 12°х1,5°. Антенны имеют устройство механического сканирования луча, что позволяет одновременно осуществлять просмотр определенного участка пространства. Система наведения ракет позволяет одновременно наводить на цель одну или две ракеты. Для обеспечения возможности работы в условиях помех станция оборудована телевизионной оптической камерой, позволяющей обнаруживать цели на дальностях до 25 км, а также контролировать результаты стрельбы.", "qs": [{"q": "Каково назначение зенитного ракетного комплекса С-125?", "o": ["Зенитный ракетный комплекс С-125 предназначен для поражения воздушных целей на малых и средних высотах.", "Зенитный ракетный комплекс С-125 предназначен для обстреливания радиолокационно наблюдаемых наземных и надводных целей.", "Зенитный ракетный комплекс С-125 предназначен для поражения воздушных целей на больших высотах.", "Зенитный ракетный комплекс С-125 предназначен для уничтожения надводных целей на малых и средних дальностях."], "fix": false}, {"q": "Как осуществляется управление полетом ракеты 5В24?", "o": ["Управление полетом ракеты 5В24 осуществляется с помощью команд, формируемых станцией наведения ракет и передаваемых по радиолинии управления на борт.", "Управление полетом ракеты 5В24 осуществляется с помощью команд управления, формируемых на борту ракеты.", "Управление полетом ракеты 5В24 осуществляется с помощью команд, получаемых от воздушных целей и передаваемых по радиолинии управления на борт.", "Управление полетом ракеты 5В24 осуществляется без использования команд, формируемых станцией наведения ракет."], "fix": false}, {"q": "Общее время работы стартового двигателя и маршевого двигателя?", "o": ["21,3 с.", "2,6 с.", "18,7 с.", "16,1 с."], "fix": false}, {"q": "Чем отличается новая ракета 5В27 от двухступенчатой твердотопливной ракеты 5В24?", "o": ["Новая ракета 5В27 отличается от двухступенчатой твердотопливной ракеты 5В24 конструкцией маршевого двигателя и имела новую более мощную боевую часть 5Б18 массой 72 кг.", "Новая ракета 5В27 отличается от двухступенчатой твердотопливной ракеты 5В24 конструкцией стартового двигателя и имела новую более мощную боевую часть 5Б18 массой 72 кг.", "Новая ракета 5В27 отличается от двухступенчатой твердотопливной ракеты 5В24 конструкцией маршевого двигателя и имела менее мощную боевую часть 5Б18 массой 72 кг.", "Новая ракета 5В27 отличается от двухступенчатой твердотопливной ракеты 5В24 конструкцией стартового двигателя и маршевого двигателя."], "fix": false}, {"q": "Что позволяет обнаруживать цели на дальностях до 25 км и контролировать результаты стрельбы?", "o": ["Оборудованная телевизионной оптической камерой станция наведения ракет позволяет обнаруживать цели на дальностях до 25 км и контролировать результаты стрельбы.", "Антенны позволяют обнаруживать цели на дальностях до 25 км, а также контролировать результаты стрельбы", "Новая ракета 5В27 позволяет обнаруживать цели на дальностях до 25 км, а также контролировать результаты стрельбы", "Тепловизионная камера видеонаблюдения позволяет обнаруживать цели на дальностях до 25 км, а также контролировать результаты стрельбы."], "fix": false}]}, {"id": 3, "p": "Самонаведением называется автоматическое наведение ракеты на цель, основанное на использовании энергии, идущей от цели к ракете.\nГоловка самонаведения ракеты автономно осуществляет сопровождение цели, определяет параметр рассогласования и формирует команды управления ракетой.\nПо виду энергии, которую излучает или отражает цель, системы самонаведения разделяются на радиолокационные и оптические (инфракрасные или тепловые, световые, лазерные и др.).\nВ зависимости от места расположения первичного источника энергии системы самонаведения могут быть пассивными, активными и полуактивными.\nПри пассивном самонаведении энергия, излучаемая или отражаемая целью, создается источниками самой цели или естественным облучателем цели (Солнцем, Луной). Следовательно, информация о координатах и параметрах движения цели может быть получена без специального облучения цели энергией какого-либо вида.\nСистема активного самонаведения характеризуется тем, что источник энергии, облучающий цель, устанавливается на ракете и для самонаведения ракет используется отраженная от цели энергия этого источника.\nПри полуактивном самонаведении цель облучается первичным источником энергии, расположенным вне цели и ракеты.\nРадиолокационные системы самонаведения получили широкое распространение в зенитных ракетных комплексах из-за их практической независимости действия от метеорологических условий и возможности наведения ракеты на цель любого типа и на различные дальности. Они могут использоваться на всем или только на конечном участке траектории зенитной управляемой ракеты, т. е. в сочетании с другими системами управления (системой телеуправления, программного управления).\nВ радиолокационных системах применение пассивного способа самонаведения весьма ограничено. Такой способ возможен лишь в частных случаях, например при самонаведении ракет на самолет, имеющий на своем борту непрерывно работающий радиопередатчик помех. Поэтому в радиолокационных системах самонаведения применяют специальное облучение («подсвечивание») цели. При самонаведении ракеты на всем участке ее траектории полета к цели, как правило, по энергетическим и стоимостным соотношениям применяются полуактивные системы самонаведения. Первичный источник энергии (радиолокатор подсвета цели) обычно располагается на пункте наведения. В комбинированных системах применяются как полуактивная, так и активная системы самонаведения. Ограничение по дальности активной системы самонаведения происходит за счет максимальной мощности, которую можно получить на ракете с учетом возможных габаритов и массы бортовой аппаратуры, в том числе и антенны головки самонаведения.", "qs": [{"q": "Какова задача у головки самонаведения ракеты?", "o": ["Все ответы правильные.", "Головка самонаведения ракеты автономно осуществляет сопровождение цели, определяет параметр рассогласования и формирует команды управления ракетой.", "Головка самонаведения ракеты применяется для автономного сопровождения цели и определения параметра рассогласования и формирования команд управления ракетой.", "Задача головки самонаведения ракеты заключает в автономном сопровождении цели и определении параметра рассогласования и формировании команд управления ракетой."], "fix": true}, {"q": "По каким признакам системы самонаведения могут быть пассивными, активными и полуактивными?", "o": ["По местам расположения первичного источника энергии системы самонаведения могут быть пассивными, активными и полуактивными.", "По виду энергии, которую излучает или отражает цель, системы самонаведения разделяются на пассивные, активные и полуактивные.", "По мощности энергии, идущей от цели к ракете, системы самонаведения могут быть пассивными, активными и полуактивными.", "По информации о координатах и параметрах движения цели системы самонаведения могут быть пассивными, активными и полуактивными."], "fix": false}, {"q": "Что такое система активного самонаведения?", "o": ["Система активного самонаведения характеризуется тем, что источник энергии, облучающий цель, устанавливается на ракете и для самонаведения ракет используется отраженная от цели энергия этого источника", "При активном самонаведении энергия, излучаемая или отражаемая целью, создается источниками самой цели или естественным облучателем цели (Солнцем, Луной).", "При активном самонаведении цель облучается первичным источником энергии, расположенным вне цели и ракеты.", "При активном самонаведении энергия информация о координатах и параметрах движения цели может быть получена без специального облучения цели энергией какого-либо вида."], "fix": false}, {"q": "Почему радиолокационные системы самонаведения получили широкое распространение в зенитных ракетных комплексах (ЗРК)?", "o": ["Радиолокационные системы самонаведения получили широкое распространение в ЗРК из-за их практической независимости действия от метеорологических условий и возможности наведения ракеты на цель любого типа и на различные дальности.", "Радиолокационные системы самонаведения получили широкое распространение в ЗРК потому, что они не могут использоваться на всем участке траектории зенитной управляемой ракеты.", "Радиолокационные системы самонаведения получили широкое распространение в ЗРК потому, что они просты в конструкции и дешевы по сравнению с другими системами управления (системой телеуправления, программного управления).", "Радиолокационные системы самонаведения получили широкое распространение в ЗРК из-за их практической независимости действия от условий помех и возможности наведения ракеты на цель любого типа и на различные дальности."], "fix": false}, {"q": "Почему ограничено применение пассивного способа самонаведения в радиолокационных системах?", "o": ["Потому, что применение пассивного способа возможно лишь в частных случаях, например при самонаведении ракет на самолет, имеющий на своем борту непрерывно работающий радиопередатчик помех", "Потому, что ограничение по дальности пассивного системы самонаведения происходит за счет максимальной мощности, которую можно получить на ракете с учетом возможных габаритов и массы бортовой аппаратуры, в том числе и антенны головки самонаведения.", "Потому, что применение пассивного способа невозможно на всем участке траектории полета ракеты к цели.", "Применение пассивного способа самонаведения в радиолокационных системах ограничено по причине энергетических и стоимостных соотношений."], "fix": false}]}, {"id": 4, "p": "Зенитная ракетная система большой дальности С-200 (SA-5 «Gammon») предназначена для борьбы с современными и перспективными воздушными целями: самолетами дальнего радиолокационного обнаружения и управления, воздушными элементами разведывательно-ударных комплексов, высотными скоростными самолетами-разведчиками типа SR-71, постановщиками помех и другими пилотируемыми и беспилотными средствами воздушного нападения в условиях интенсивного радиопротиводействия. Система всепогодная и может эксплуатироваться в различных климатических условиях.\nРазработка комплекса начата в 50-х годах в КБ-1 (ныне «Алмаз»). Генеральный конструктор А. Расплетин. Зенитная управляемая ракета была разработана в КБ «Факел», генеральный конструктор П. Грушин. За время своего существования ЗРС С-200 многократно модернизировалась. В ходе модернизаций были значительно увеличены дальность стрельбы и высота поражения цели (с 20 до 41 км).\nОсновными элементами зенитной ракетной системы С-200 являются зенитные ракетные дивизионы и зенитные управляемые ракеты. Каждый дивизион включает радиолокатор подсветки цели и стартовую батарею.\nЗенитная управляемая ракета системы С-200 двухступенчатая. Первая ступень состоит из четырех твердотопливных ускорителей. Маршевая ступень оснащена жидкостным двухкомпонентным ракетным двигателем. Боевая часть осколочно-фугасная. Ракета имеет головку для полуактивного самонаведения.\nРадиолокатор подсвета цели представляет собой высокопотенциальную радиолокационную станцию непрерывного излучения. Она осуществляет сопровождение цели и вырабатывает информацию для пуска ракеты. Кроме этого, подсвечивает цели в процессе самонаведения ракеты.\nСтартовая батарея имеет шесть пусковых установок, которые располагаются по кругу вокруг радиолокатора подсвета цели. На них осуществляется хранение, предстартовая подготовка и старт зенитных ракет.\nВ состав зенитного ракетного комплекса С-200 входят: пункт управления и целеуказания К-9М, радиолокатор подсвета цели РПЦ 5Н62В (антенный пост К-1В, аппаратная кабина К-2В), стартовая батарея 5Ж51 (кабина подготовки старта К-ЗВ, пусковые установки 5П72В, заряжающие машины 5Ю24М, зенитные управляемые ракеты 5В21В и 5В28), источники электропитания - дизель-электростанции.", "qs": [{"q": "Каково назначение зенитной ракетной системы большой дальности С-200?", "o": ["Зенитная ракетная система большой дальности С-200 предназначена для борьбы с современными и перспективными воздушными целями в условиях интенсивного радиопротиводействия.", "Зенитная ракетная система большой дальности С-200 предназначена для борьбы с средствами наземного нападения.", "Зенитная ракетная система большой дальности С-200 предназначена для уничтожения низколетящих воздушных целей.", "Зенитная ракетная система большой дальности С-200 предназначена для уничтожения кораблей противника в различных климатических условиях."], "fix": false}, {"q": "Кто был генеральным конструктором зенитных управляемых ракет 5В21В и 5В28?", "o": ["П. Грушин.", "КБ-1 (ныне «Алмаз»)", "SA-5 «Gammon»)", "А. Расплетин"], "fix": false}, {"q": "Что было улучшено в ходе модернизаций зенитной ракетной системы С-200?", "o": ["В ходе модернизаций были значительно увеличены дальность стрельбы и высота поражения цели.", "В ходе модернизаций была улучшена точность стрельбы на высотные скоростные самолеты.", "В ходе модернизаций была улучшена конструкция ракеты.", "В ходе модернизаций была улучшена способность быстродействия радиолокатора подсветки цели."], "fix": false}, {"q": "Какой состав зенитной ракетной системы С-200?", "o": ["Пункт управления и целеуказания, радиолокатор подсвета цели, стартовая батарея (кабина подготовки старта, пусковые установки, заряжающие машины, зенитные управляемые ракеты), источники электропитания.", "Радиолокатор подсвета цели, зенитные управляемые ракеты, пусковые установки", "Радиолокатор подсвета цели и стартовая батарея, источники электропитания", "Пункт управления и целеуказания, антенный пост, аппаратная кабина, пусковые установки."], "fix": false}, {"q": "Какие виды топлива используются в двухступенчатой ракете системы С-200?", "o": ["В двухступенчатой ракете системы С-200 используются твердое и жидкостное двухкомпонентное топлива.", "В двухступенчатой ракете системы С-200 используется только твердое топливо.", "В двухступенчатой ракете системы С-200 используется только жидкостное двухкомпонентное топливо.", "В двухступенчатой ракете системы С-200 используется либо жидкостное либо твердое топливо."], "fix": false}]}, {"id": 5, "p": "Под комбинированным управлением понимается сочетание различных систем управления при наведении ракеты на цель. В зенитных ракетных комплексах оно применяется при стрельбе на большие дальности для получения требуемой точности наведения ракеты на цель при допустимых массовых значениях зенитных управляемых ракет (ЗУР). Возможны такие последовательные комбинации систем управления: телеуправление первого вида и самонаведение, телеуправление первого и второго вида, автономная система и самонаведение.\nПрименение комбинированного управления обуславливает необходимость решения таких задач, как сопряжение траекторий при переходе с одного способа управления на другой, обеспечение захвата цели головкой самонаведения ракеты в полете, использование одних и тех же устройств бортовой аппаратуры на различных этапах управления и др.\nВ момент перехода на самонаведение (телеуправление второго вида) цель должна находиться в пределах диаграммы направленности приемной антенны головки самонаведения (ГСН), ширина которой обычно не превосходит 5-10°. Кроме того, должно быть осуществлено наведение следящих систем: ГСН по дальности, по скорости или по дальности и скорости, если предусмотрена селекция цели по данным координатам для повышения разрешающей способности и помехозащищенности системы управления.\nНаведение ГСН на цель может производиться следующими способами: по командам, передаваемым на борт ракеты с пункта наведения; включением автономного автоматического поиска цели ГСН по угловым координатам, дальности и частоте; сочетанием предварительного командного наведения ГСН на цель с последующим поиском цели.\nКаждый из первых двух способов имеет свои преимущества и существенные недостатки. Задача обеспечения надежного наведения ГСН на цель в процессе полета ракеты к цели является достаточно сложной и может потребовать применения третьего способа. Предварительное наведение ГСН позволяет сузить диапазон поиска цели.\nПри комбинации систем телеуправления первого и второго вида после начала функционирования бортового радиопеленгатора в устройство выработки команд наземного пункта наведения может поступать информация одновременно от двух источников: станции слежения за целью и ракетой и бортового радиопеленгатора. На основе сравнения сформированных команд по данным каждого источника представляется возможным решить задачу сопряжения траекторий, а также повысить точность наведения ракеты на цель (снизить случайные составляющие ошибок путем выбора источника, взвешиванием дисперсий сформированных команд). Такой способ комбинации систем управления получил название бинарного управления.", "qs": [{"q": "Что такое комбинированное управление?", "o": ["Под комбинированным управлением понимается сочетание различных систем управления при наведении ракеты на цель.", "Комбинированное управление представляет собой улучшенную систему телеуправления или улучшенную систему самонаведения.", "Комбинированное управление представляет собой систему управления с использования головки самонаведения ракеты на всей траектории её полета к цели.", "Под комбинированным управлением понимается систему управления, которая может управлять многими ракетами различных видов."], "fix": false}, {"q": "Какие последовательные комбинации возможны при комбинированном управлении?", "o": ["Все варианты.", "Телеуправление первого и второго вида.", "Автономная система и самонаведение.", "Телеуправление первого вида и самонаведение."], "fix": true}, {"q": "Какие задачи нужно решить для применения комбинированного управления?", "o": ["Все три задачи.", "Задачу об обеспечении захвата цели головкой самонаведения ракеты в полете.", "Задачу о сопряжении траекторий при переходе с одного способа управления на другой.", "Задачу об использовании одних и тех же устройств бортовой аппаратуры на различных этапах управления и др."], "fix": true}, {"q": "Какие условия должно быть выполняться в момент перехода на самонаведение (или на телеуправление второго вида)?", "o": ["В момент перехода на самонаведение (или на телеуправление второго вида) цель должна находиться в пределах диаграммы направленности приемной антенны ГСН и должно быть осуществлено наведение следящих систем.", "В момент перехода на самонаведение (или на телеуправление второго вида) наземный пункт управления должен находиться в пределах диаграммы направленности приемной антенны ГСН и должно быть осуществлено наведение следящих систем.", "В момент перехода на самонаведение (или на телеуправление второго вида) должно быть выключен автономный автоматический поиск цели головкой самонаведения.", "В момент перехода на самонаведение (или на телеуправление второго вида) цель должна находиться в пределах диаграммы направленности приемной антенны радиолокационной станции наведения."], "fix": false}, {"q": "Что такое бинарное управление?", "o": ["Это комбинация телеуправления первого вида и второго вида, при которой в устройство выработки команд наземного пункта наведения поступают информации одновременно от станции слежения за целью и ракетой и бортового радиопеленгатора.", "Это комбинация автономной системы и самонаведения, при которой в устройство выработки команд наземного пункта наведения поступают информации одновременно от командного пукнта и бортового радиопеленгатора.", "Это комбинация телеуправления первого вида и самонаведения, при которой в устройство выработки команд наземного пункта наведения поступают информации одновременно от головки самонаведения и бортового радиопеленгатора.", "Все варианты не правильные."], "fix": true}]}, {"id": 6, "p": "Методы наведения ракет зенитного ракетного комплекса С-125М\nМетодом наведения называется заданный закон сближения ракеты с целью, который в зависимости от координат и параметров движения цели определяет требуемое движение ракеты, обеспечивающее попадание ракеты в цель. Теоретическую траекторию ракеты, определяющую уравнениями метода наведения принято называть кинематической или требуемой траекторией наведения.\nХарактер траектории устанавливается на основании исследований наведения ракеты на цель, движение цели задано. При кинематическом исследовании ракета – математическая точка, движущаяся под действием определенных сил. Реальная траектория всегда будет отличаться от кинематической из-за воздействия на систему “ракета-цель” различных внешних возмущений, инерциональности ракеты, элементов системы управления, наличия инструментальных ошибок. Однако эти отличия должны быть в пределах заданной точности наведения ракеты на цель.\nВ ЗРК С-125-2ТМ применяются два метода наведения – МТТ и КДУ. Они существенно отличаются друг от друга. Основное отличие этих двух методов наведения состоит в том, что метод МТТ является трехточечным методом наведения (СНР – ракета – цель), а метод КДУ – двухточечным (ракета – цель).\nПри трехточечном методе наведения МТТ кинематическое уравнение метода задается в виде уравнения связи координат цели и ракеты, измеряемых относительно начала координат, находящегося в третьей точке. Обычно в этой точке расположен наземный радиолокатор, осуществляющий слежение за целью и ракетой и измерение их координат. В ЗРК С-125-2ТМ таким радиолокатором является СНР.\nВ двухточечных методах наведения, к которым относится и метод КДУ, кинематические уравнения устанавливают связь не только между относительными координатами ракеты, а между координатами и их производными. Невозможность реализации метода наведения, заданного уравнение связи двух относительных координат ракеты в плоскости наведения, состоит в том, что при этом накладываются ограничения на взаимную скорость сближения ракеты с целью, которая не является управляемой.\nТаким образом, помимо различий физической сущности кинематических уравнений двух разновидностей применяемых в ЗРК С-125-2ТМ методов наведения (трехточечного МТТ и двухточечного КДУ) их кинематические уравнения отличаются и с точки зрения математической классификации: математические уравнения метода МТТ являются алгебраическими, а кинематические уравнения метода КДУ – дифференциальными. Эти особенности, являясь формальными и чисто математическими, в тоже время принципиально влияют на физический смысл управления ракетой.", "qs": [{"q": "Что такое кинематическая траектория наведения?", "o": ["Кинематической траекторией наведения называется теоретическая траектория ракеты, определяющую уравнениями метода наведения.", "Кинематической траекторией наведения называется закон сближения ракеты с целью, который в зависимости от координат и параметров движения цели определяет требуемое движение ракеты, обеспечивающее попадание ракеты в цель.", "Кинематической траекторией наведения называется траектория движения ракеты, при котором осуществляется максимальная вероятность попадания ракеты в цель.", "Кинематической траекторией наведения называется теоретическая траектория ракеты, определяющую динамическими уравнениями движения ракеты."], "fix": false}, {"q": "Почему реальная траектория движения ракеты отличается от кинематической траектории наведения?", "o": ["Потому, что на систему “ракета-цель” воздействуют различные внешние возмущения, инерциональности ракеты, элементы системы управления, наличия инструментальных ошибок.", "Потому, что при построении кинематической траектории наведения ракеты на цель не задано движение цели.", "Потому, что при исследовании этих траекторий использованы разные методы наведения.", "Потому, что на систему “ракета-цель” не учитывается воздействие различных внешних возмущений, инерциональности ракеты, элементов системы управления, наличия инструментальных ошибок."], "fix": false}, {"q": "Какие методы наведения применяются в ЗРК С-125-2ТМ?", "o": ["Метод трех точек, двухточечный метод кинематических дифференциальных уравнений.", "Метод погони, двухточечный метод кинематических дифференциальных уравнений.", "Метод трехточечного наведения и метод прямого наведения.", "Двухточечный метод КДУ и метод параллельного сближения."], "fix": false}, {"q": "Чем отличается двухточечный метод наведения от трехточечного метода наведения?", "o": ["Двухточечный метод наведения отличается от трехточечного метода наведения тем, что при двухточечном методе наведения кинематические уравнения устанавливают связь между относительными координатами ракеты и между координатами и их производными.", "Двухточечный метод наведения отличается от трехточечного метода наведения тем, что при двухточечном методе наведения кинематические уравнения задаются в виде связи координат цели и начала координат.", "Двухточечный метод наведения отличается от трехточечного метода наведения тем, что при трехточечном методе наведения кинематические уравнения устанавливают связь между относительными координатами ракеты и между координатами и их производными.", "Двухточечный метод наведения отличается от трехточечного метода наведения тем, что при двухточечном методе наведения кинематические уравнения составляются без учета координат целей."], "fix": false}, {"q": "Какой метод наведения имеет кинематические уравнения во виде алгебраических?", "o": ["Метод трех точек.", "И метод трех точек и двухточечный метод КДУ.", "Двухточечный метод КДУ.", "И двухточечный метод КДУ и метод параллельного сближения."], "fix": false}]}, {"id": 7, "p": "Зенитный ракетный комплекс (ЗРК) - совокупность функционально связанных боевых и технических средств, предназначенных для поражения воздушных целей зенитными управляемыми ракетами.\nКаждый ЗРК обладает определенными боевыми свойствами, особенностями, совокупность которых может служить классификационными признаками, позволяющими отнести его к определенному типу.\nХарактеризуя зенитный ракетный комплекс, как основную единицу зенитной ракетной системы, в первую очередь имеют в виду его боевые возможности, которые характеризуются совокупностью показателей, определяющих способность комплекса перейти в состояние готовности и обеспечить уничтожение целей на различных дальностях и высотах полета в заданном диапазоне скоростей, в условиях радиоэлектронного подавления и маневра воздушных целей, при различной плотности удара воздушного противника.\nПоказателями боевых возможностей ЗРК могут быть следующие:\nвсепогодностъ;\nпомехозащищенность\nмобильность;\nуниверсальность;\nнадежность.\nВсепогодностъ отражает возможности ЗРК по уничтожению воздушных целей в любых погодных условиях. Различают всепогодные ЗРК и невсепогодные. Последние обеспечивают выполнение боевой задачи при определенных погодных условиях и заданном времени суток.\nПомехозащищенность - свойство, позволяющее ЗРК уничтожать воздушные цели в условиях помех, создаваемых противником для подавления электронных (оптических) средств.\nМобильность - свойство, проявляющееся в транспортабельности и времени перехода из походного положения в боевое и из боевого в походное. Составной частью мобильности является маневренность. Наиболее мобильным считается комплекс, обладающий большей транспортабельностью и требующий меньшего времени на совершение маневра. Мобильные комплексы могут быть самоходными, буксируемыми и переносными. Немобильные ЗРК называют стационарными.\nУниверсальность – свойство, характеризующее технические возможности ЗРК уничтожать воздушные цели в большом диапазоне дальности, высот и скоростей.\nНадежность – способность ЗРК нормально функционировать в заданных условиях эксплуатации.\nЧисленные значения основных параметров боевых возможностей ЗРК определяются тактико-техническими характеристиками, которые формулируются на этапе разработки нового образца ЗРК и уточняются в ходе последующих полигонных испытаний.\nК ним относятся: назначение ЗРК; дальности и высоты поражения воздушных целей; возможности уничтожения целей, летящих с различными скоростями; вероятности поражения воздушных целей; число целевых и ракетных каналов; помехозащищенность ЗРК; работное время ЗРК; время перевода ЗРК из походного положения в боевое и наоборот; скорость передвижения; боекомплект ракет; запас хода; массовые и габаритные характеристики и др.", "qs": [{"q": "Чем характеризуются боевые возможности ЗРК?", "o": ["Боевые возможности характеризуются совокупностью показателей, определяющих способность комплекса перейти в состояние готовности и обеспечить уничтожение целей на различных дальностях и высотах полета в заданном диапазоне скоростей, в условиях радиоэлектронного подавления и маневра воздушных целей, при различной плотности удара воздушного противника.", "Боевые возможности характеризуются совокупностью показателей, определяющих способность комплекса перейти в состояние готовности и обеспечить уничтожение целей в любых погодных условиях.", "Боевые возможности характеризуются совокупностью показателей, определяющих способность перехода из походного положения в боевое и обратно за установленное время.", "Боевые возможности характеризуются совокупностью показателей, определяющих способность ЗРК нормально функционировать в заданных условиях эксплуатации."], "fix": false}, {"q": "Чем отличаются всепогодные ЗРК от невсепогодных?", "o": ["Всепогодные ЗРК отличаются от невсепогодных возможностью уничтожения воздушных целей в любых погодных условиях.", "Всепогодные ЗРК отличаются от невсепогодных возможностью уничтожения воздушных целей при определенных погодных условиях.", "Всепогодные ЗРК отличаются от невсепогодных выполнением боевой задачи при определенных погодных условиях и заданном времени суток.", "Всепогодные ЗРК отличаются от невсепогодных возможностью уничтожения воздушных целей в большом диапазоне дальности, высот и скоростей."], "fix": false}, {"q": "Какой комплекс считается наиболее мобильным?", "o": ["Наиболее мобильным считается комплекс, обладающий большей транспортабельностью и требующий меньшего времени на совершение маневра.", "Наиболее мобильным считается комплекс, обладающий меньшей транспортабельностью и требующий большего времени на совершение маневра.", "Наиболее мобильным считается комплекс, обладающий способность нормально функционировать в заданных условиях эксплуатации.", "Наиболее мобильным считается стационарный комплекс"], "fix": false}, {"q": "Что такое универсальность ЗРК?", "o": ["Универсальность – свойство, характеризующее технические возможности ЗРК уничтожать воздушные цели в большом диапазоне дальности, высот и скоростей.", "Универсальность – свойство, характеризующее способность комплекса перейти в состояние готовности в любых условиях эксплуатации.", "Универсальность – свойство, характеризующее возможности ЗРК по уничтожению воздушных целей в любых погодных условиях", "Универсальность – свойство, характеризующее технические возможности ЗРК уничтожать воздушные цели в определенном диапазоне дальности, высот и скоростей."], "fix": false}, {"q": "Какой показатель ЗРК определяет его способность нормально функционировать в заданных условиях эксплуатации?", "o": ["Надежность", "Универсальность", "Помехозащищенность", "Мобильность"], "fix": false}]}, {"id": 8, "p": "Переносный зенитный ракетный комплекс (ПЗРК) «Starburst»\nФирма Shorts создавала ПЗРК «Starburst» с середины 80-х годов (первоначальное название «Джавелин S15»). Он представляет собой вариант ПЗРК «Джавелин» с улучшенной помехозащищенностью.\nВ простой конфигурации ПЗРК «Starburst» состоит из двух частей: ракеты в транспортно-пусковом контейнере (ТПК) и присоединенного прицельного устройства.\nРакета «Starburst» твердотопливная, двухступенчатая. Боевая часть осколочно-фугасная. Взрыватель двух типов: контактный и неконтактный. Команды управления ракетой принимаются находящимся в головной части ракеты блоком. Баллистическая стабильность обеспечивается хвостовыми стабилизаторами, в которых размещаются два лазерных приемопередатчика системы наведения.\nКаждый из блоков приемопередатчика включает лазерный приемник, сигнальный процессор и передатчик, которые размещены в малом цилиндрическом контейнере. \nПриемопередатчик команд управления на борт ракеты установлен в носовой части контейнера. Оптические сигналы данных обнаружения принимаются малыми антеннами, соединенными с блоком управления. Он представляет собой блок от ПЗРК «Джавелин» с измененным программным обеспечением.\nРакетный контейнер одноразовый, имеет цилиндрическую форму. На нем размещен электрический разъем, для того чтобы сигналы от пускового механизма подавались на электрические цепи ракеты. В пусковом контейнере передняя крышка выбрасывается давлением газа, когда ракетный гироскоп запущен.\nПрицельный блок с размерами 408x342x203 мм состоит из системы управления и системы наведения, которая не требует регулировок и проверок, имеет оптическую стабилизированную систему, передатчик команд наведения, шестикратный монокулярный оптический прицел и устройство ручного ввода метки. Все это находится в собственном герметичном корпусе, выполненном из легких сплавов.\nБлок управления состоит из легкого корпуса, в котором находится герметически закрытое отделение (с переключателем компенсации ветра и электронным оборудованием, необходимым для обработки информации управления), монтируемая снаружи батарея питания и система ручного управления, в которую входит джойстик, спусковой механизм, переключатель выбора вида взрывателя и кнопочный переключатель выбора высоты. В бою, когда артиллерист получает целеуказание, он обнаруживает цель с помощью прицела и сопровождает ее, перемещая оружие так, чтобы цель совпадала с маркером прицельного устройства. При этом автоматически вычисляются углы упреждения по азимугу и углу места. При вхождении цели в зону пуска стрелок приводит в действие спусковой механизм.", "qs": [{"q": "Каков состав ПЗРК «Starburst»?", "o": ["ПЗРК «Starburst» состоит из двух частей: ракеты в транспортно-пусковом контейнере и присоединенного прицельного устройства", "ПЗРК «Starburst» состоит из транспортно-пускового контейнера и ракет.", "ПЗРК «Starburst» состоит из транспортно-пускового контейнер, ракет и блоков приемопередатчика.", "ПЗРК «Starburst» состоит из твердотопливного двигателя, боевой части, взрывателя и блока управления"], "fix": false}, {"q": "Чем отличается ПЗРК «Starburst» от ПЗРК «Джавелин»?", "o": ["ПЗРК «Starburst» отличается от ПЗРК «Джавелин» улучшенной помехозащищенностью.", "ПЗРК «Starburst» отличается от ПЗРК «Джавелин» простой конфигурации", "ПЗРК «Starburst» отличается от ПЗРК «Джавелин» твердотопливной двухступенчатой ракетой", "ПЗРК «Starburst» отличается от ПЗРК «Джавелин» размерами прицельного блока"], "fix": false}, {"q": "Чем обеспечивается баллистическая стабильность ракеты «Starburst»?", "o": ["Баллистическая стабильность ракеты «Starburst» обеспечивается установленными в хвостовой части стабилизаторами.", "Баллистическая стабильность ракеты «Starburst» обеспечивается применением взрывателя двух типов: контактного и неконтактного.", "Баллистическая стабильность ракеты «Starburst» обеспечивается блоками приемопередатчика.", "Баллистическая стабильность ракеты «Starburst» обеспечивается оптической стабилизированной системы"], "fix": false}, {"q": "Для чего на ракетном контейнере размещен электрический разъем?", "o": ["Электрический разъем применяется для того, чтобы сигналы от пускового механизма подавались на электрические цепи ракеты.", "Размещенный на ракетном контейнере электрический разъем используется для выбрасывания передней крыши пускового контейнера.", "Размещенный на ракетном контейнере электрический разъем используется для приемопередачи команд управления на борт ракеты.", "Размещенный на ракетном контейнере электрический разъем используется для регулирования и проверки системы управления."], "fix": false}, {"q": "Что входит в состав блока управления?", "o": ["Легкий корпус, монтируемая снаружи батарея питания и система ручного управления.", "Переключатель компенсации ветра и электронное оборудование, необходимое для обработки информации управления, переключатель выбора вида взрывателя и кнопочный переключатель выбора высоты.", "Монтируемая снаружи батарея питания и система ручного управления, в которую входит джойстик, спусковой механизм, переключатель выбора вида взрывателя и кнопочный переключатель выбора высоты.", "Легкий корпус, джойстик, спусковой механизм, переключатель выбора вида взрывателя и кнопочный переключатель выбора высоты."], "fix": false}]}, {"id": 9, "p": "Зенитный ракетный комплекс (ЗРК) средней дальности «Пэтриот»\nЗРК средней дальности «Пэтриот» предназначен для поражения самолетов и баллистических ракет оперативно-тактического назначения на малых, средних и больших высотах в условиях сильного электронного противодействия противника.\nОсновная огневая единица - батарея способна одновременно обстреливать до восьми воздушных целей. В ее состав входят командный пункт управления огнем AN/MSQ-104, многофункциональная радиолокационная станция AN/MPQ-53 с фазированной антенной решеткой, восемь пусковых установок с зенитными управляемыми ракетами (ЗУР) MIM-104 в транспортно-пусковых контейнерах, радиорелейные станции MRC-137, средства электропитания и обслуживания.\nОдноступенчатая ЗУР МIМ-104 «Пэтриот» выполнена по нормальной аэродинамической схеме. Ее боевая часть осколочно-фугасная (масса 90,7 кг). Двигатель твердотопливный однорежимный со средней тягой 11 000 кг работает в течение 11,5 с, сообщая ракете скорость 1750 м/с. Общая масса ЗУР «Пэтриот» составляет 906 кг. Ракета рассчитана на перегрузку до 30g.\nПод носовым обтекателем находится плоская радиолокационная антенна диаметром 305 мм, состоящая из блока наведения на конечном участке (ТС-6) и модульного блока наведения на среднем участке (ММР). Блок ММР размещается в боевой части и содержит навигационную аппаратуру и бортовую ЭВМ. Здесь же установлены инерциальный блок, вспомогательная электронная аппаратура, преобразователь сигналов, предохранительно-исполнительный механизм, антенны и боевая часть. Ракеты размещаются в транспортно-пусковых контейнерах, закрытых спереди и сзади эластичными крышками.\nКомандный пункт батареи предназначен для сбора, накопления и обработки всей информации, необходимой для функционирования ЗРК, а также для управления работой РЛС AN/MPQ-53 и наведения ракет.\nМногофункциональная радиолокационная станция AN/MPQ-53 предназначена для поиска, обнаружения, опознавания и сопровождения воздушных целей и ракет, передачи на них команд управления. Для опознавания целей используется интегрированный запросчик AN/TPX-46(V)7. В зависимости от режима работы станции, передатчик РЛС формирует различные по виду модуляции, длительности и частоте повторения, мощности и рабочей частоте сверхвысокочастотные сигналы, которые по волноводу передаются на облучающий рупор. В передатчике используются 160 фиксированных рабочих частот, принадлежащих диапазону 4-6 ГГц. Выбор этого диапазона обусловлен многофункциональностью РЛС AN/MPQ-53.", "qs": [{"q": "Возможно ли уничтожить баллистических ракет на больших высотах в условиях сильного электронного противодействия противника при применении ЗРК средней дальности «Пэтриот»?", "o": ["Да, возможно.", "Нет, не возможно.", "Не достаточна информация.", "Да, возможно, но только в определенных погодных условиях."], "fix": false}, {"q": "Сколько целей одновременно ЗРК «Пэтриот» может обстреливать?", "o": ["8", "1", "11", "2"], "fix": false}, {"q": "Что входит в состав батарея?", "o": ["Все варианты", "Командный пункт управления огнем AN/MSQ-104,", "Многофункциональная радиолокационная станция AN/MPQ-53 с фазированной антенной решеткой,", "Восемь пусковых установок с зенитными управляемыми ракетами MIM-104 в транспортно- пусковых контейнерах, радиорелейные станции MRC-137, средства электропитания и обслуживания."], "fix": true}, {"q": "Где находится модульный блок наведения?", "o": ["Модульный блок наведения находится в боевой части ракеты.", "Модульный блок наведения находится в хвостовой части ракеты.", "Модульный блок наведения находится в пункте управления огнем.", "Модульный блок наведения находится в многофункциональной радиолокационной станции."], "fix": false}, {"q": "Каково назначение многофункциональной радиолокационной станции AN/MPQ-53 ?", "o": ["Многофункциональная радиолокационная станция AN/MPQ-53 предназначена для поиска, обнаружения, опознавания и сопровождения воздушных целей и ракет, передачи на них команд управления.", "Многофункциональная радиолокационная станция AN/MPQ-53 предназначена для сбора, накопления и обработки всей информации, необходимой для функционирования ЗРК, а также для управления работой РЛС AN/MPQ-53 и наведения ракет.", "Многофункциональная радиолокационная станция AN/MPQ-53 предназначена для защиты батареи от различных по виду модуляции, длительности и частоте повторения, мощности и рабочей частоте сверхвысокочастотных сигналов.", "Многофункциональная радиолокационная станция AN/MPQ-53 предназначена для формирования команд управления."], "fix": false}]}, {"id": 10, "p": "Самонаведением называется автоматическое наведение ракеты на цель, основанное на использовании энергии, идущей от цели к ракете.\nГоловка самонаведения ракеты автономно осуществляет сопровождение цели, определяет параметр рассогласования и формирует команды управления ракетой.\nПо виду энергии, которую излучает или отражает цель, системы самонаведения разделяются на радиолокационные и оптические (инфракрасные или тепловые, световые, лазерные и др.).\nВ зависимости от места расположения первичного источника энергии системы самонаведения могут быть пассивными, активными и полуактивными.\nПри пассивном самонаведении энергия, излучаемая или отражаемая целью, создается источниками самой цели или естественным облучателем цели (Солнцем, Луной). Следовательно, информация о координатах и параметрах движения цели может быть получена без специального облучения цели энергией какого-либо вида.\nСистема активного самонаведения характеризуется тем, что источник энергии, облучающий цель, устанавливается на ракете и для самонаведения ракет используется отраженная от цели энергия этого источника.\nПри полуактивном самонаведении цель облучается первичным источником энергии, расположенным вне цели и ракеты.\nРадиолокационные системы самонаведения получили широкое распространение в зенитных ракетных комплексах из-за их практической независимости действия от метеорологических условий и возможности наведения ракеты на цель любого типа и на различные дальности. Они могут использоваться на всем или только на конечном участке траектории зенитной управляемой ракеты, т. е. в сочетании с другими системами управления (системой телеуправления, программного управления).\nВ радиолокационных системах применение пассивного способа самонаведения весьма ограничено. Такой способ возможен лишь в частных случаях, например при самонаведении ракет на самолет, имеющий на своем борту непрерывно работающий радиопередатчик помех. Поэтому в радиолокационных системах самонаведения применяют специальное облучение («подсвечивание») цели. При самонаведении ракеты на всем участке ее траектории полета к цели, как правило, по энергетическим и стоимостным соотношениям применяются полуактивные системы самонаведения. Первичный источник энергии (радиолокатор подсвета цели) обычно располагается на пункте наведения. В комбинированных системах применяются как полуактивная, так и активная системы самонаведения. Ограничение по дальности активной системы самонаведения происходит за счет максимальной мощности, которую можно получить на ракете с учетом возможных габаритов и массы бортовой аппаратуры, в том числе и антенны головки самонаведения.", "qs": [{"q": "Что такое самонаведение?", "o": ["Самонаведением называется автоматическое наведение ракеты на цель, основанное на использовании энергии, идущей от цели к ракете.", "Самонаведением называется автоматическое наведение ракеты на цель, основанное на использовании энергии, идущей от естественного облучателя к ракете.", "Самонаведением называется автоматическое наведение ракеты на цель, основанное на использовании команд управления от наземлого пункта.", "Самонаведением называется наведение ракеты на цель, основанное на заданной программе полета ракеты.."], "fix": false}, {"q": "По каким признакам системы самонаведения могут быть пассивными, активными и полуактивными?", "o": ["По местам расположения первичного источника энергии системы самонаведения могут быть пассивными, активными и полуактивными.", "По виду энергии, которую излучает или отражает цель, системы самонаведения разделяются на пассивные, активные и полуактивные.", "По мощности энергии, идущей от цели к ракете, системы самонаведения могут быть пассивными, активными и полуактивными.", "По информации о координатах и параметрах движения цели системы самонаведения могут быть пассивными, активными и полуактивными."], "fix": false}, {"q": "Какое подтверждение правильно про систему активного самонаведения?", "o": ["Система активного самонаведения характеризуется тем, что источник энергии, облучающий цель, устанавливается на ракете и для самонаведения ракет используется отраженная от цели энергия этого источника", "При активном самонаведении энергия, излучаемая или отражаемая целью, создается источниками самой цели или естественным облучателем цели (Солнцем, Луной).", "При активном самонаведении цель облучается первичным источником энергии, расположенным вне цели и ракеты.", "При активном самонаведении энергия информация о координатах и параметрах движения цели может быть получена без специального облучения цели энергией какого-либо вида."], "fix": false}, {"q": "Почему радиолокационные системы самонаведения получили широкое распространение в зенитных ракетных комплексах (ЗРК)?", "o": ["Радиолокационные системы самонаведения получили широкое распространение в ЗРК из-за их практической независимости действия от метеорологических условий и возможности наведения ракеты на цель любого типа и на различные дальности.", "Радиолокационные системы самонаведения получили широкое распространение в ЗРК потому, что они не могут использоваться на всем участке траектории зенитной управляемой ракеты.", "Радиолокационные системы самонаведения получили широкое распространение в ЗРК потому, что они просты в конструкции и дешевы по сравнению с другими системами управления (системой телеуправления, программного управления).", "Радиолокационные системы самонаведения получили широкое распространение в ЗРК из-за их практической независимости действия от условий помех и возможности наведения ракеты на цель любого типа и на различные дальности."], "fix": false}, {"q": "Почему ограничено применение пассивного способа самонаведения в радиолокационных системах?", "o": ["Потому, что применение пассивного способа возможно лишь в частных случаях, например при самонаведении ракет на самолет, имеющий на своем борту непрерывно работающий радиопередатчик помех", "Потому, что ограничение по дальности пассивного системы самонаведения происходит за счет максимальной мощности, которую можно получить на ракете с учетом возможных габаритов и массы бортовой аппаратуры, в том числе и антенны головки самонаведения.", "Потому, что применение пассивного способа невозможно на всем участке траектории полета ракеты к цели.", "Применение пассивного способа самонаведения в радиолокационных системах ограничено по причине энергетических и стоимостных соотношений."], "fix": false}]}, {"id": 11, "p": "СРЕДСТВА ОБНАРУЖЕНИЯ\nВ ракетных комплексах в качестве средств обнаружения летательного аппарата (ЛА) могут использоваться радиолокационные станции, оптические и пассивные пеленгаторы.\nОптические средства обнаружения (ОСО). В зависимости от места расположения источника излучения лучистой энергии оптические средства обнаружения подразделяются на пассивные и полуактивные. В пассивных ОСО, как правило, используется лучистая энергия, обусловленная нагревом обшивки ЛА и работающими двигателями, либо световая энергия Солнца, отраженная от ЛА. В полуактивных ОСО на наземном пункте управления располагается оптический квантовый генератор (лазер), энергия которого используется для зондирования пространства.\nПассивное ОСО представляет собой телевизионно-оптический визир, в состав которого входят передающая телевизионная камера (ПТК), синхронизатор, каналы связи, видеоконтрольное устройство (ВКУ).\nТелевизионно-оптический визир преобразует поток световой (лучистой) энергии, идущей от ЛА, в электрические сигналы, которые передаются по кабельной линии связи и используются в ВКУ для воспроизведения переданного изображения ЛА, находящегося в поле зрения объектива ПТК.\nВ передающей телевизионной трубке оптическое изображение преобразуется в электрическое, при этом на фотомозаике (мишени) трубки возникает потенциальный рельеф, отображающий в электрической форме распределение яркости всех точек ЛА.\nСчитывание потенциального рельефа происходит электронным лучом передающей трубки, который под действием поля отклоняющих катушек движется синхронно с электронным лучом ВКУ. На сопротивлении нагрузки передающей трубки возникает видеосигнал изображения, который усиливается предварительным усилителем и по каналу связи поступает на ВКУ. Видеосигнал после усиления в усилителе подается на управляющий электрод приемной трубки (кинескопа).\nСинхронизация движения электронных лучей ПТК и ВКУ осуществляется импульсами строчной и кадровой разверток, которые не смешиваются с сигналом изображения, а передаются по отдельному каналу.\nПолуактивные ОСО (лазерные визиры) по своей структуре, принципам построения и выполняемым функциям почти полностью аналогичны радиолокационным. Они позволяют определять угловые координаты, дальность и скорость цели.\nВ качестве источника сигнала используется лазерный передатчик, запуск которого осуществляется импульсом синхронизатора. Световой сигнал лазера излучается в пространство, отражается от ЛА и принимается телескопом.\nУзкополосный фильтр, стоящий на пути отраженного импульса, уменьшает воздействие посторонних источников света на работу визира. Отраженные от ЛА световые импульсы попадают на светочувствительный приемник, преобразуются в сигналы видеочастоты и используются в блоках измерения угловых координат и дальности, а также для отображения на экране индикатора", "qs": [{"q": "Как делятся оптические средства обнаружения по месту расположения источника излучения лучистой энергии?", "o": ["На полуактивные и пассивные", "На активные и пассивные", "На активные, полуактивные и пассивные", "На полуактивные и активные"], "fix": false}, {"q": "Из чего состоят пассивные оптические средства обнаружения?", "o": ["Синхронизатор, передающая телевизионная камера, каналы связи, видеоконтрольное устройство", "Телевизионно-оптический визир", "Оптический квантовый генератор", "Передающая телевизионная камера, каналы связи, видеоконтрольное устройство"], "fix": false}, {"q": "Что преобразуется в передающей телевизионной трубке?", "o": ["Оптическое изображение преобразуется в электрическое", "Электрический сигнал преобразуется в оптическоеизображение", "Поток световой энергии преобразуется в электрические сигналы", "Электрический сигнал преобразуется в поток световой энергии"], "fix": false}, {"q": "Что определяется полуактивным ОСО?", "o": ["Дальность, скорость цели и угловые координаты", "Азимут и угол места ЛА", "Угловые координаты, дальность", "Угловые координаты, дальность и ускорение цели."], "fix": false}, {"q": "Для чего используется узкополосный фильтр?", "o": ["Для уменьшения воздействия посторонних источников света на работу визира", "Для увеличения воздействия посторонних источников света на работу визира", "Для отображения на экране индикатора.", "Ни один из этих ответов не является правильным"], "fix": false}]}, {"id": 12, "p": "РАДИОПЕРЕДАЮЩИЕ И РАДИОПРИЕМНЫЕ\nУСТРОЙСТВА\nЛюбая система, использующая радиоволны для передачисообщений (радиовещание, телевидение, связь) и полученияинформации о местоположении объектов (радиолокация, радионавигация), состоит из радиолиний. Обязательными элементами радиолиний являются передающее устройство, приемное устройство и пространство, в котором распространяются радиоволны.\nПередающее устройство предназначено для преобразования сообщений в радиоволны. Оно состоит из передатчика и передающей антенны. Передатчик осуществляет преобразование сообщений в электрические колебания высокой частоты. Электрические колебания‚ поступают в антенну, которая преобразует их в радиоволны, т.е. с помощью антенны осуществляется радио-излучение.\nВ передатчике происходят три основных процесса: генерирование, (образование) электрических колебаний высокой частоты‚ управление одним из параметров этих колебаний(амплитудой, частотой или фазой) в соответствии с передаваемым сообщением и усиление высокочастотных колебаний донеобходимой мощности.\nСоздание колебаний производится с помощью генератора,работающего в автоколебательном режиме. Этот генератор называется возбудителем или задающим генератором (ЗГ), поскольку он задает (устанавливает) частоту колебаний передатчика.\nУправление параметрами высокочастотного колебания позакону передаваемого сообщения называется модуляцией. Онаосуществляется модулятором. В результате модуляции получаются модулированные колебания с высокой несущей частотой.\nУсиление высокочастотных колебаний производится с помощью усилителей мощности. В передатчиках радиолокационных станций (РЛС) усиление колебаний обычно не производится‚ так как используются задающие генераторы большой мощности. К типичным мощным генераторам РЛС относятся магнетроны.\nВсякое радиопередающее устройство характеризуется параметрами (качественными показателями), которые определяют области его применения и существенно влияют на параметры радиолинии в целом. К основным параметрам передающегоустройства можно отнести: диапазон рабочих частот, мощность излучения, стабильность частоты.\nРадиоволны, излучаемые передающей антенной, распространяются в пространстве со скоростью света.\nРадиоприемное устройство предназначено для приема радиоволн, преобразования их в электрические колебания и длявыделения передаваемого сообщения. Оно состоит из приёмнойантенны, радиоприемника и оконечного прибора.\nПриёмная антенна принимает радиоволны и преобразует их в колебания высокой частоты. Радиоприемник осуществляет усиление этих колебаний и выделение электрического сигнала полезного сообщения. Этот сигнал подается на оконечный прибор, который воспроизводит полезное сообщение.\nВ настоящее время наиболее широкое применение получили супергетеродинные радиоприемники. В этих приемниках входная цепь и усилитель высокой частоты обеспечивают усиление и прохождение колебаний только заданной частоты. Затем высокочастотные модулированные колебания поступают на смеситель, на который подаются также немодулированные колебания от гетеродина. Смеситель, гетеродин последующий усилитель промежуточной частоты обеспечивают преобразование несущей частоты модулированных колебании в более низкую промежуточную частоту, а также усиление этих колебаний", "qs": [{"q": "Что входит в состав передающего устройства?", "o": ["Передатчика и передающие антенны", "Приемная антенна, радиоприемник и оконечный прибор", "Передатчик и приемная антенна", "Приемная антенна, передающие антенны"], "fix": false}, {"q": "Сколько основных процессов происходит в передатчике?", "o": ["3", "2", "4", "5"], "fix": false}, {"q": "Для чего предназначен усилитель мощности?", "o": ["Для усиления высокочастотных колебаний", "Для создания колебаний", "Для управления параметрами высокочастотного колебания", "Для преобразования сообщений в радиоволны"], "fix": false}, {"q": "Что не является основным параметром передающего устройства?", "o": ["Чувствительность", "Диапазон рабочих частот", "Мощность излучения", "Стабильность частоты"], "fix": false}, {"q": "Куда подаются немодулированные колебания от гетеродина?", "o": ["На смеситель", "На детектор", "На оконечный прибор", "На усилитель"], "fix": false}]}, {"id": 13, "p": "ЭЛЕМЕНТЫ СИСТЕМ УПРАВЛЕНИЯ РАКЕТАМИ\nУправляемая ракета - беспилотный летательный аппарат (ЛА) с реактивным двигателем, предназначенный для поражения воздушных целей. Все бортовые устройства размещены на планёре ракеты.\nПланёр - несущая конструкция ракеты, которая состоит из корпуса, неподвижных и подвижных аэродинамических поверхностей. Корпус планёра обычно цилиндрической формы с конической (сферической, оживальной) головной частью.\nАэродинамические поверхности планера служат для создания подъемной и управляющих сил. К ним относятся крылья, стабилизаторы (неподвижные поверхности), рули. По взаимному расположению рулей и неподвижных аэродинамических поверхностей различают следующие аэродинамические схемы ракет: нормальная, «бесхвостка», «утка», «поворотное крыло».\nДвигатели управляемых ракет делятся на две группы: ракетные и воздушно-реактивные.\nРакетным называется двигатель, который использует топливо, полностью находящееся на борту ракеты. Для его работы не требуется забора кислорода из окружающей среды. По виду топлива ракетные двигатели разделяются на ракетные двигатели твердого топлива (РДТТ) и жидкостные ракетные двигатели (ЖРД). В качестве топлива в РДТТ используются ракетный порох и смесевое твердое топливо, которые заливаются и прессуются непосредственно в камеру сгорания двигателя.\nВоздушно-реактивные двигатели (ВРД) - двигатели, в которых окислителем служит кислород, забираемый из окружающего воздуха. В результате на борту ракеты содержится только горючее, что позволяет увеличить запас топлива. Недостаток ВРД - невозможность их работы в разреженных слоях атмосферы. Они могут применяться на ЛА при высотах полета до 35-40 км.\nАвтопилот (АП) предназначен для стабилизации угловых движений ракеты относительно центра масс. Кроме того, АП является составной частью системы управления полетом ракеты и управляет положением самого центра масс в пространстве в соответствии с командами управления. В первом случае автопилот выполняет роль системы стабилизации ракеты, во втором - роль элемента системы управления.\nДля стабилизации ракеты в продольной, азимутальной плоскостях и при движении относительно продольной оси ракеты (по крену) используются три независимых канала стабилизации: по тангажу, курсу и крену.\nБоевое снаряжение зенитных и авиационных ракет - сочетание боевой части и взрывателя.\nБоевая часть имеет боевой заряд, детонатор и корпус. По принципу действия боевые части могут быть осколочными и осколочно-фугасными. Некоторые типы УР могут оснащаться и ядерными боевыми частями.\nВзрыватели ракет могут быть неконтактными и контактными. Неконтактные взрыватели в зависимости от места положения источника энергии, используемой для срабатывания взрывателя, подразделяются на активные, полуактивные и пассивные", "qs": [{"q": "Какую форму имеет корпус планёра?", "o": ["Цилиндрическую форму с конической головной частью", "Сферическую форму", "Коническую форму", "Оживальную форму"], "fix": false}, {"q": "Что входит в состав аэродинамических поверхностей планера?", "o": ["Стабилизаторы, рули, крылья", "Корпус, крылья, рули", "Автопилот", "Воздушно-реактивные двигатели"], "fix": false}, {"q": "Каково назначение автопилота?", "o": ["Для стабилизации угловых движений ракеты относительно центра масс и для управления положением самого центра масс в пространстве в соответствии с командами управления", "Для стабилизации угловых движений ракеты относительно центра масс", "Для управления полетом ракеты", "Для стабилизации ракеты в продольной, азимутальной плоскостях"], "fix": false}, {"q": "Что является недостатоком воздушно-реактивных двигателей?", "o": ["Невозможность их работы в разреженных слоях атмосферы.", "Возможность их работы в разреженных слоях атмосферы.", "Невозможность их работы в плотных слоях атмосферы.", "Возможность их работы в плотных слоях атмосферы."], "fix": false}, {"q": "По какому признаку разделят боевые части на осколочные и осколочно-фугасные?", "o": ["По принципу действия", "По дальности действия", "По типу взрыватели", "По типу детонатора"], "fix": false}]}, {"id": 14, "p": "ДВИЖЕНИЕ РАКЕТЫ В ПРОСТРАНСТВЕ И СИЛЫ,\nДЕЙСТВУЮЩИЕ НА НЕЁ\nДля исследования движения ракет используют различные системы координат, в частности земную (относительную) и связанную.\nВ земной системе координат положение ракеты в пространстве определяется тремя координатами — Xg, Yg, Zg . Начало этой системы лежит в точке пуска ракеты, за ось Хg принимают касательную к дугe земной поверхности, соединяющую точку пуска с целью. Ось Yg направляют при этом перпендикулярно вверх, а ось Zg перпендикулярно двум первым осям. \nВ связанной системе координат начало её помешается в центре тяжести ракеты. Ось X1 вправлена вдоль оси ракеты и называется ее продольной осью. Оси Y1 и Z1 располагаются перпендикулярно оси X1. \nЧтобы полностью ориентировать положение ракеты в пространстве как жесткого тела, в дополнение к координата Xg, Yg, Zg вводятся еще три угла.\nУгол между продольной осью ракеты Х1 и плоскостью XgZg, т.е. угол наклона оси ракеты по отношению к стартовому «горизонту», называют углом тангажа и обозначают ϑ.\nУгол, который составляет ось ракеты с плоскостью XgYg, называют углом рыскания и обозначают ψ.\nУгол, определяющий поворот корпуса ракеты относительно продольной оси, между осью Y1 и плоскостью XgYg называют углом крена γ.\nСледовательно, три координаты -Xg, Yg, Zg и три угла ϑ, ψ и γ  полностью определяют положение ракеты в пространство.\nВ общем случае на ракету в полёте действуют следующие внешние силы: сила тяги реактивного двигателя Р, сила тяжести (веса) G, аэродинамическая сила R и сила органов управления полетом ракеты. Кроме того,необходимо еще учитывать силу инерции Кориолиса.\nВ частных случаях некоторые из этих сил могут не действовать на ракету или их действием можно пренебрегать.\nНа активном участке траектории на ракету действуютвсе перечисленные выше силы. На участке, проходящем в сильно разреженных слоях атмосферы практически действуюттолько сила тяжести и сила инерции Кориолиса. На участке, когда ракета вновь входит в плотные слои атмосферы, действуют три силы: сила тяжести, аэродинамическая сила и сила инерции Кориолиса.\nСила тяги Р действует вдоль продольной оси ракеты по направлению ее движения. \nСила веса G ракеты направлена вниз к центру Земли именяется за счет выгорания топлива и изменения ускорения gсилы тяжести с высотой. \nАэродинамическая сила R действует на ракету лишь при полете в плотных слоях атмосферы. Она зависит от размеров и формы ракеты, скорости ивысоты её полёта, а также от величины углов атаки и скольжения.", "qs": [{"q": "Чем определяется полностью положение ракеты в пространстве?", "o": ["Положение ракеты в пространстве полностью определяется тремя координатами — Xg, Yg, Zg и тремя углами ϑ, ψ и γ.", "Положение ракеты в пространстве определяется тремя координатами - Xg, Yg, Zg.", "Положение ракеты в пространстве определяется тремя углами ϑ, ψ и γ", "Положение ракеты в пространстве определяется траекториями ракеты."], "fix": false}, {"q": "От чего зависит аэродинамическая сила?", "o": ["От скорости ивысоты её полёта, размеров и формы ракеты, а также от величины углов атаки и скольжения.", "От размеров и формы ракеты, скорости и высоты её полёта.", "Отразмеров и формы ракеты, а также от величины углов атаки и скольжения.", "От географической широты."], "fix": false}, {"q": "Какие системы координат используются для исследования движения ракеты?", "o": ["Различные системы координат, в частности земную (относительную) и связанную.", "Земная система координат", "Связанная система координат", "Относительная система координат"], "fix": false}, {"q": "Чем называют угол наклона оси ракеты по отношению к стартовому «горизонту»?", "o": ["Углом тангажа", "Углом рыскания", "Углом крена", "Углом атаки"], "fix": false}, {"q": "Какие силы действуют на ракету, когда она вновь входит в плотные слои атмосферы?", "o": ["Сила тяжести, аэродинамическая сила и сила инерции Кориолиса", "Сила тяжести и сила органов управления полетом ракеты.", "Сила тяги реактивного двигателя Р, сила тяжести (веса) G, аэродинамическая сила R и сила органов управления полетом ракеты.", "Сила тяги реактивного двигателя Р, сила тяжести (веса) G, аэродинамическая сила R, газодинамическая сила и сила инерции Кориолиса."], "fix": false}]}, {"id": 15, "p": "Квазибаллистическая ракета «Искандер-М»\n«Искандер-М» — вариант для Российских вооружённых сил с двумя квазибаллистическими ракетами 9М723 на пусковой установке, дальность стрельбы согласно упоминанию в различных источниках составляет до 500 км.\nРакета комплекса 9М723 имеет одну ступень с твёрдотопливным двигателем. Ракета изготовлена с применением технологий понижения радиолокационной заметности (так называемой «Стелс-технологии»): малая поверхность рассеивания, малый размер выступающих частей, радиопоглощающее покрытие.\n«Искандер» имеет следующие характеристики, превращающие его из тактического в «геостратегическое оружие»:\n«Искандер» имеет средства маневрирования на всех участках траектории полета (разгон, баллистическая часть, финиширование)\n«Искандер» укомплектован модулями радиоэлектронной борьбы (РЭБ) и сбрасываемыми ложными целями\nДля защиты ракеты от поражения системами противовоздушной и противоракетной обороны (ПВО/ПРО) на разгонном участке ракета использует аэродинамические рули для интенсивного маневрирования при наборе высоты.\nДля защиты от поражения системами ПВО/ПРО на баллистическом участке траектории, большая часть полёта проходит на высоте около 50 км, что существенно выше потолка действия таких систем ПВО как Patriot.\nПРО класса THAAD рассчитаны на вычисление траектории неуправляемых баллистических ракет как Р-17 «Скад» с поражением именно на высотной части прямым столкновением. Часть экспертов считает, что против THAAD «Искандер-М» использует маневрирование за счёт газоструйных рулей. Поэтому считается, что траектория «Искандер-М» не баллистическая, как у ракет класса Р-17 Скад, а «квазибаллистическая».\nМежду тем, имеются сообщения и о других возможных технологиях защиты от ПРО на баллистическом участке траектории без маневрирования, но за счёт использования ложных целей. Часть экспертов отмечает, что по уровню оснащения средствами прорыва ПРО «Искандер» эквивалентен таким межконтинентальным  баллистическим ракетам (МБР), как «Тополь-М».\nДля защиты от поражения ПВО/ПРО на финишном участке поражения цели, при спуске к цели ракета маневрирует с перегрузкой 20-30 единиц (G) в первую очередь за счёт аэродинамических рулей. Ракета имеет гиперзвуковую скорость на финишном отрезке траектории 2100-2600 м/с (6-7 чисел Маха). Эти показатели превышают или находятся на грани возможностей лучших систем ПРО/ПВО среднего уровня дальности.\nТакже основным поражающим боеприпасом «Искандера» для поражения комплексов ПВО/ПРО являются кассетные боевые части. За счёт практически вертикального захода «Искандера» на цель и использования управляемых боевых частей возможен ранний их сброс с высоты до 1,4 км до цели, что делает невозможным эффективное применение против ракеты зенитной артиллерии комплекса ПВО ближнего радиуса действия, который функционально защищает систему ПРО от атак ракетами", "qs": [{"q": "Сколько ракет на одной ПУ для варианта «Искандер-М»?", "o": ["2", "3", "4", "1"], "fix": false}, {"q": "Что такое “Стелс-технология”?", "o": ["“Стелс-технология”– это техн
